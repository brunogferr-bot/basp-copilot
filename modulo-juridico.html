<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASP · Jurídico</title>
<link rel="stylesheet" href="basp-tema.css">
<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#1b1712;--ink-soft:#6b6258;--border:#e7e0d6;--gold:#a8853a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  #app{max-width:1000px;margin:0 auto;padding:18px 18px 90px}
  a{color:inherit}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .brand{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .brand small{display:block;font-size:12px;font-weight:500;color:var(--ink-soft)}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--ink);
    padding:8px 13px;border-radius:8px;font-size:13.5px;cursor:pointer;font-family:inherit;text-decoration:none;
    display:inline-block}
  .btn:hover{border-color:var(--gold)}
  .btn-sm{padding:5px 10px;font-size:12.5px}
  .nota{font-size:12px;color:var(--ink-soft);margin-top:8px}
  .up{color:#3fa66a}.down{color:#c05c52}.neutro{color:var(--ink-soft)}

  /* ===== AVISO DE ESTIMATIVA =====
   * Bruno, 14/08/2026: "deixe uma informacao de que a base de calculo nao e
   * real, e uma estimativa baseada em faturamento, que e necessario validar
   * com o informe de rendimentos".
   * A tarja fica no topo e cada bloco repete a ressalva. Numero de dinheiro
   * sem etiqueta vira verdade na cabeca de quem le. */
  .tarja{margin:14px 0 0;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.55;
    border:1px solid #c99a3e;background:rgba(201,154,62,.12)}
  .tarja b{font-weight:700}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}
  .kpi{padding:12px 13px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
  .kpi .rot{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .kpi .val{font-size:22px;font-weight:700;margin:5px 0 3px;letter-spacing:-.02em}
  .kpi .pe{font-size:12px;color:var(--ink-soft);line-height:1.45}

  h3{margin:26px 0 4px;font-size:16px}
  .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.55}

  .fab{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:14px;margin-bottom:10px}
  .fab .cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .fab .nome{font-size:15px;font-weight:700}
  .fab .pct{font-size:12.5px;color:var(--ink-soft)}
  .fab .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
  .fab .cel{padding:8px 10px;border:1px solid var(--border);border-radius:8px}
  .fab .cel .r{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .fab .cel .v{font-size:15px;font-weight:700;margin-top:2px}
  .flags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
  .flag{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--border);color:var(--ink-soft)}
  .flag.alerta{border-color:#c99a3e;color:#8a6a1f;background:rgba(201,154,62,.10)}

  .spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:10px}
  .spark i{flex:1;background:var(--gold);opacity:.55;border-radius:1px;min-height:1px}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .rolagem{overflow-x:auto}

  .anexo{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--ink-soft)}
  .vazio{padding:28px;text-align:center;color:var(--ink-soft)}

  /* Contrato revisado. O que a fabrica escreveu fica em texto normal; o que
   * nos incluimos fica em italico e com barra lateral - decisao do Bruno em
   * 15/08/2026, para nao restar duvida sobre a autoria de cada linha. */
  .contrato{border:1px solid var(--border);border-radius:10px;background:var(--card);
    padding:16px;margin-top:10px;font-size:13.5px;line-height:1.7;white-space:pre-wrap}
  .contrato .orig{margin:0 0 12px}
  .contrato .novo{margin:0 0 12px;font-style:italic;padding-left:12px;
    border-left:3px solid var(--gold);color:var(--ink)}
  .contrato .novo small{display:block;font-style:normal;font-size:11px;color:var(--ink-soft);margin-top:3px}
  textarea.campo{width:100%;min-height:150px;padding:11px;border:1px solid var(--border);
    border-radius:9px;font-family:inherit;font-size:13.5px;line-height:1.6;background:var(--card);color:var(--ink)}
  .incons{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    font-family:inherit;font-size:13px;background:var(--card);color:var(--ink);margin-top:6px}
</style>
</head>
<body>
<div id="app">Carregando…</div>

<script>
/* =====================================================================
 * BASP COPILOT - MODULO JURIDICO
 *
 * O que esta tela responde:
 *   1. quanto de comissao cada fabrica gerou, mes a mes;
 *   2. quanto seria o acerto se aquela fabrica desligasse a BASP hoje;
 *   3. o que no cadastro da fabrica destoa da Lei 4.886/65.
 *
 * A LEI QUE SUSTENTA CADA NUMERO
 *   art. 27, "j"    - indenizacao nao inferior a 1/12 do TOTAL da retribuicao
 *                     auferida durante todo o tempo da representacao. Nao e
 *                     1/12 do ultimo ano: e de tudo.
 *   art. 34         - aviso previo de 30 dias OU 1/3 das comissoes dos tres
 *                     meses anteriores, em contrato por prazo indeterminado
 *                     que ja tenha vigorado mais de seis meses.
 *   art. 32, par.4o - comissao calculada sobre o valor TOTAL das mercadorias.
 *   art. 32, par.7o - vedadas alteracoes que reduzam a media dos seis meses.
 *   art. 44 par.un. - prescreve em cinco anos.
 *
 * O QUE ESTA TELA NAO E
 *   Nao e calculo de comissao real. O Mercos entrega FATURAMENTO; a comissao
 *   aqui e faturamento x percentual do cadastro. A comissao real depende de
 *   base liquida, devolucao, cancelamento e do que cada fabrica de fato
 *   pagou - isso so aparece no informe de rendimentos. Enquanto o informe
 *   nao for anexado, todo numero desta tela e ESTIMATIVA, e a tela diz isso.
 *
 *   Tambem nao e parecer juridico. Ela aponta o artigo; quem interpreta e
 *   advogado.
 * ===================================================================== */

const DEFAULT_API_BASE = 'https://basp-rotas-api.onrender.com';
const API_BASE_KEY = 'basp_rotas_api_base_v1';
const API_TOKEN_KEY = 'basp_rotas_api_token_v1';
const ANEXOS_KEY = 'basp_juridico_anexos_v1';

function getApiBase() { return localStorage.getItem(API_BASE_KEY) || DEFAULT_API_BASE; }
function getApiToken() { return (localStorage.getItem(API_TOKEN_KEY) || '').trim(); }

async function apiFetch(path) {
  const res = await fetch(getApiBase().replace(/\/$/, '') + path, {
    headers: { 'Content-Type': 'application/json', 'x-api-token': getApiToken() },
  });
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  if (!res.ok) throw new Error((body && body.error) || ('Erro ' + res.status + ' ao falar com o servidor.'));
  return body;
}

const state = { jur: null, erro: null, ativas: null, tela: 'lista', fabricaEnc: null, encerramentos: null, fabricaCtr: null, contratos: null };

const fmt = (n) => (n == null ? '--' :
  'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const curto = (n) => {
  if (n == null) return '--';
  const v = Number(n);
  if (Math.abs(v) >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (Math.abs(v) >= 1e3) return 'R$ ' + (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil';
  return fmt(v);
};
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* Anexos ficam no proprio aparelho por enquanto: guardar contrato e informe
 * de rendimentos no servidor exige tratamento de documento e consentimento
 * que ainda nao foi decidido. O campo registra que o documento existe, a data
 * real de inicio e onde ele esta - o arquivo em si fica onde ja esta hoje. */
function lerAnexos() {
  try { return JSON.parse(localStorage.getItem(ANEXOS_KEY) || '{}'); } catch (e) { return {}; }
}
function salvarAnexos(a) {
  try { localStorage.setItem(ANEXOS_KEY, JSON.stringify(a)); } catch (e) {}
}

const mesesOrdenados = (obj) => Object.keys(obj || {}).sort();

function calcular() {
  const j = state.jur;
  if (!j || j.vazio || !j.cadastro) return null;

  const pct = {};
  const meta = {};
  (j.cadastro || []).forEach((c) => {
    if (!c.nome) return;
    pct[c.nome] = c.pct;
    meta[c.nome] = c;
  });

  /* A BASP aparece no cadastro do Mercos como se fosse representada (44%).
   * E a propria empresa, nao uma fabrica - fica de fora de tudo. */
  const ehFabrica = (nome) => nome && nome.toUpperCase() !== 'BASP';

  const nomes = [...new Set([
    ...Object.keys(j.total || {}),
    ...Object.keys(j.mensal || {}),
  ])].filter(ehFabrica);

  const hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
  const mesAtual = hoje.slice(0, 7);

  let linhas = nomes.map((nome) => {
    const p = pct[nome];
    const m = meta[nome] || {};
    const serie = j.mensal[nome] || {};
    const anos = j.anual[nome] || {};
    const totalFat = (j.total || {})[nome] || 0;

    const temPct = typeof p === 'number' && p > 0;
    const com = (v) => (temPct ? v * (p / 100) : null);

    /* COMISSAO REGISTRADA vs ESTIMADA.
     * A varredura de pedidos traz valor_total_comissao - a comissao que o
     * proprio Mercos calculou, ja com o criterio da representada (inclusive
     * o desconto de IPI e ST, quando ela desconta). Isso vale mais que
     * faturamento x percentual, entao e a fonte preferida.
     * A estimativa fica como reserva, para fabrica sem comissao registrada.
     * A DIFERENCA entre as duas e informacao juridica: e onde aparece, em
     * reais, o efeito de descontar imposto da base que o art. 32, par. 4o
     * discute. */
    /* PERCENTUAL RETROATIVO - decisao do Bruno em 14/08/2026.
     * Quando o cadastro do Mercos estava errado (Greice marcada 4% e Faruk 5%,
     * quando o certo sempre foi 5,5% e 7%), o percentual correto vale para
     * TODA a historia, nao daqui para frente. O cadastro nao registrava uma
     * mudanca de acordo: registrava um erro.
     * Por isso a conta principal e faturamento x percentual ATUAL. A comissao
     * que o Mercos gravou fica ao lado, como comparacao - ela usa o percentual
     * da epoca, que e justamente o que estava errado. */
    const comRegistrada = (j.comissaoTotal || {})[nome];
    const temReg = typeof comRegistrada === 'number' && comRegistrada > 0;
    const comSerie = (j.comissaoMensal || {})[nome] || null;

    const totalCom = com(totalFat);
    const difBase = (temReg && totalCom != null) ? totalCom - comRegistrada : null;
    const umDoze = totalCom == null ? null : totalCom / 12;

    /* art. 34: 1/3 das comissoes dos TRES MESES ANTERIORES. Anteriores, sem o
     * corrente, que ainda esta aberto e puxaria a conta para baixo no dia 3. */
    const ms = mesesOrdenados(serie).filter((k) => k < mesAtual).slice(-3);
    const fat3 = ms.reduce((s, k) => s + (serie[k] || 0), 0);
    const com3 = com(fat3);
    const aviso = com3 == null ? null : com3 / 3;

    const acerto = (umDoze == null || aviso == null) ? null : umDoze + aviso;

    const anosComVenda = Object.keys(anos).filter((a) => anos[a] > 0).sort();
    /* A varredura de pedidos da a data exata do primeiro pedido, nao so o ano. */
    const primeiraData = (j.primeira || {})[nome] || null;
    const primeiroAno = primeiraData ? primeiraData.slice(0, 4)
      : (anosComVenda.length ? anosComVenda[0] : null);

    const doze = mesesOrdenados(serie).slice(-12);
    const fat12 = doze.reduce((s, k) => s + (serie[k] || 0), 0);

    /* art. 32, par.7o: media dos ultimos seis meses contra os seis anteriores */
    const todos = mesesOrdenados(serie);
    const u6 = todos.slice(-6).reduce((s, k) => s + (serie[k] || 0), 0) / 6;
    const a6 = todos.slice(-12, -6).reduce((s, k) => s + (serie[k] || 0), 0) / 6;
    const varMedia = a6 > 0 ? (u6 - a6) / a6 : null;

    return {
      nome, pct: p, meta: m, serie, anos, primeiroAno, primeiraData,
      totalFat, totalCom, umDoze, aviso, acerto, fat12,
      com12: com(fat12),
      comRegistrada: temReg ? comRegistrada : null,
      vigia: (j.vigia || {})[nome] || null,
      registrada: temReg, difBase, impostos: (j.impostos || {})[nome] || 0,
      taxaEfetiva: (temReg && totalFat > 0) ? (comRegistrada / totalFat) * 100 : null,
      pedidos: (j.pedidos || {})[nome] || 0,
      varMedia, mesesSerie: todos,
    };
  }).filter((l) => l.totalFat > 0);

  linhas.sort((a, b) => (b.acerto || 0) - (a.acerto || 0));

  /* SO FABRICAS ATIVAS - decisao do Bruno em 14/08/2026:
   * "as fabricas que nao estao listadas como ativa ja nao fazem parte do
   * escritorio, ja fiz acerto com todas".
   * Fabrica encerrada com acerto pago nao tem 1/12 a receber, nao tem prazo do
   * art. 33 correndo e nao interessa no alerta de queda de media. Deixa-las na
   * conta enchia a tela de 32 "quedas" que eram so representacoes que
   * acabaram - ruido que esconde o que importa.
   * Se a lista de ativas nao carregar, a tela avisa em vez de fingir que
   * filtrou: numero errado sem aviso e pior que numero faltando. */
  const ativas = new Set(state.ativas || []);
  const semFiltro = !ativas.size;
  const todasLinhas = linhas;
  if (!semFiltro) linhas = linhas.filter((l) => ativas.has(l.nome));
  const encerradas = todasLinhas.length - linhas.length;

  const somaAcerto = linhas.reduce((s, l) => s + (l.acerto || 0), 0);

  return {
    linhas,
    somaAcerto,
    totalComissaoHistorica: linhas.reduce((s, l) => s + (l.totalCom || 0), 0),
    comissao12: linhas.reduce((s, l) => s + (l.com12 || 0), 0),
    descontamST: linhas.filter((l) => l.meta.descontaST).length,
    descontamIPI: linhas.filter((l) => l.meta.descontaIPI).length,
    atualizadoEm: j.atualizadoEm || null,
    semFiltro, encerradas,
  };
}

function renderSpark(l) {
  const ms = l.mesesSerie.slice(-24);
  if (!ms.length) return '';
  const teto = Math.max(...ms.map((k) => l.serie[k] || 0), 1);
  return '<div class="spark">' + ms.map((k) => {
    const h = Math.round(((l.serie[k] || 0) / teto) * 100);
    return `<i style="height:${Math.max(1, h)}%" title="${k}"></i>`;
  }).join('') + '</div>';
}

function renderFabrica(l, anexos) {
  const a = anexos[l.nome] || {};
  const flags = [];
  if (l.meta.descontaST) flags.push('<span class="flag alerta">desconta ST da base</span>');
  if (l.meta.descontaIPI) flags.push('<span class="flag alerta">desconta IPI da base</span>');
  if (l.meta.parcelaUnica) flags.push('<span class="flag">paga em parcela única</span>');
  if (l.varMedia != null && l.varMedia <= -0.15) {
    flags.push(`<span class="flag alerta">média caiu ${Math.round(l.varMedia * 100)}% em 6 meses</span>`);
  }
  const ct = ctrDe(l.nome);
  if (!ct || !ct.texto) {
    flags.push('<span class="flag alerta" style="border-color:#c05c52;color:#c05c52;background:rgba(192,92,82,.10)">SEM CONTRATO REGISTRADO</span>');
  } else if (ct.analise && ct.analise.graves) {
    flags.push('<span class="flag alerta">' + ct.analise.graves + ' ponto(s) grave(s) no contrato</span>');
  }
  if (!l.registrada) flags.push('<span class="flag">comissão estimada, sem registro no Mercos</span>');
  /* TAXA EFETIVA, e nao "diferenca de base".
   * Conferido em 14/08/2026: valor_total_comissao do Mercos e exatamente
   * faturamento x percentual do cadastro - Ferrari deu 5,99%, Greice 4,00%,
   * Via Star 4,97%. Ou seja, esse campo NAO reflete o desconto de IPI e ST;
   * o desconto acontece fora do Mercos, no que a fabrica de fato paga.
   * Anunciar a diferenca como "efeito do imposto" seria mentira - o que ela
   * mostra, quando aparece, e que o percentual mudou ao longo do tempo. */
  if (l.taxaEfetiva != null && l.pct != null && l.taxaEfetiva < l.pct * 0.97) {
    flags.push(`<span class="flag alerta">Mercos gravou a ${l.taxaEfetiva.toFixed(2).replace('.', ',')}% · diferença de ${curto(l.difBase)}</span>`);
  }
  if (l.vigia && l.vigia.cancelados) {
    flags.push(`<span class="flag">${l.vigia.cancelados} pedidos cancelados · ${curto(l.vigia.valorCancelado)}</span>`);
  }

  return `<div class="fab">
    <div class="cab">
      <div>
        <div class="nome">${esc(l.nome)}</div>
        <div class="pct">${l.pct != null ? l.pct.toFixed(2).replace('.', ',') + '% de comissão' : 'percentual não cadastrado'}
          · desde ${a.inicio ? esc(a.inicio) + ' (contrato)' : (l.primeiraData ? l.primeiraData.split('-').reverse().join('/') + ' (1º pedido)' : (l.primeiroAno ? l.primeiroAno + ' (1º pedido)' : '--'))}
          ${l.pedidos ? '· ' + l.pedidos + ' pedidos' : ''}</div>
      </div>
      <div style="text-align:right">
        <div class="pct">acerto estimado</div>
        <div class="nome">${curto(l.acerto)}</div>
      </div>
    </div>

    <div class="grade">
      <div class="cel"><div class="r">Faturamento total</div><div class="v">${curto(l.totalFat)}</div></div>
      <div class="cel"><div class="r">${l.registrada ? 'Comissão registrada' : 'Comissão estimada'}</div><div class="v">${curto(l.totalCom)}</div></div>
      <div class="cel"><div class="r">1/12 · art. 27 j</div><div class="v">${curto(l.umDoze)}</div></div>
      <div class="cel"><div class="r">Aviso prévio · art. 34</div><div class="v">${curto(l.aviso)}</div></div>
    </div>

    ${renderSpark(l)}
    ${flags.length ? `<div class="flags">${flags.join('')}</div>` : ''}

    <div class="anexo">
      Contrato: <b>${a.contrato ? esc(a.contrato) : 'não anexado'}</b>
      · Informe de rendimentos: <b>${a.informe ? esc(a.informe) : 'não anexado'}</b>
      <button class="btn btn-sm" data-anexo="${esc(l.nome)}" style="margin-left:8px">Registrar documento</button>
      <button class="btn btn-sm" data-contrato="${esc(l.nome)}" style="margin-left:6px">${(ctrDe(l.nome) && ctrDe(l.nome).texto) ? 'Contrato' : '⚠ Sem contrato'}</button>
      <button class="btn btn-sm" data-encerrar="${esc(l.nome)}" style="margin-left:6px">${encDe(l.nome) ? 'Ver encerramento' : 'Iniciar encerramento'}</button>
    </div>
  </div>`;
}


/* ===== VIGIA =====
 *
 * Alertas que nascem de comparar numero com prazo de lei. Cada bloco cita o
 * artigo e mostra a conta. Nenhum deles conclui nada: apontam onde olhar.
 *
 * PRAZO DO ART. 33. A lei manda a representada recusar a proposta por escrito
 * em 15, 30, 60 ou 120 dias conforme a praca do comprador; passado o prazo sem
 * recusa, a comissao e devida. O Mercos NAO registra recusa formal com data -
 * o mais proximo disso e o orcamento que nunca virou pedido. Por isso a tela
 * chama de "proposta parada", e nao de "comissao vencida": e indicio para
 * conferir, nao prova.
 *
 * PRESCRICAO. Art. 44, paragrafo unico: cinco anos. O relogio corre por
 * parcela, entao o que importa e o mes - e o que vence nos proximos 90 dias.
 */
function calcVigia(c) {
  const hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
  const alertas = [];

  /* --- 1. prescricao dos proximos 90 dias --- */
  const limite = new Date(Date.now() - (5 * 365 - 90) * 86400000);
  const mesLimite = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' })
    .format(limite).slice(0, 7);
  const cinco = new Date(Date.now() - 5 * 365 * 86400000);
  const mesCinco = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' })
    .format(cinco).slice(0, 7);

  let venceValor = 0; const venceFab = [];
  c.linhas.forEach((l) => {
    if (l.pct == null) return;
    let v = 0;
    Object.keys(l.serie || {}).forEach((m) => {
      if (m > mesCinco && m <= mesLimite) v += (l.serie[m] || 0) * (l.pct / 100);
    });
    if (v > 0) { venceValor += v; venceFab.push({ nome: l.nome, v }); }
  });
  if (venceValor > 0) {
    venceFab.sort((a, b) => b.v - a.v);
    alertas.push({
      tipo: 'prescricao',
      titulo: 'Prescrição chegando nos próximos 90 dias',
      texto: `A comissão de <b>${mesCinco.split('-').reverse().join('/')}</b> a
        <b>${mesLimite.split('-').reverse().join('/')}</b> completa cinco anos neste trimestre —
        <b>${fmt(venceValor)}</b> no total. Maiores: ${venceFab.slice(0, 3)
          .map((f) => esc(f.nome) + ' (' + curto(f.v) + ')').join(', ')}.
        Se alguma dessas parcelas não foi paga, é agora ou nunca.`,
      lei: 'Lei 4.886/65, art. 44, parágrafo único — prescreve em cinco anos.',
    });
  }

  /* --- 2. propostas paradas alem do prazo do art. 33 --- */
  const dias = (iso) => Math.floor((new Date(hoje) - new Date(iso)) / 86400000);
  const paradas = [];
  c.linhas.forEach((l) => {
    ((l.vigia && l.vigia.abertos) || []).forEach((o) => {
      const d = dias(o.data);
      /* Sem saber a praca da fabrica, o corte honesto e o mais LONGO de dentro
       * do pais: 60 dias, comprador em outro estado. Assim a tela nunca acusa
       * antes da hora. */
      if (d >= 60) paradas.push({ fab: l.nome, ...o, dias: d });
    });
  });
  paradas.sort((a, b) => b.valor - a.valor);
  if (paradas.length) {
    const soma = paradas.reduce((s2, o) => s2 + o.valor, 0);
    alertas.push({
      tipo: 'art33',
      titulo: `${paradas.length} propostas paradas há mais de 60 dias`,
      texto: `Somam <b>${fmt(soma)}</b> em pedidos que entraram como orçamento e nunca viraram
        pedido. Maiores: ${paradas.slice(0, 4).map((o) => esc(o.cliente) + ' · ' + esc(o.fab)
          + ' · ' + curto(o.valor) + ' · ' + o.dias + ' dias').join(' | ')}.
        O Mercos não registra recusa formal com data, então isto é <b>indício, não prova</b>:
        vale conferir se a fábrica recusou por escrito dentro do prazo.`,
      lei: 'Lei 4.886/65, art. 33 — 15, 30, 60 ou 120 dias conforme a praça do comprador. Sem recusa escrita no prazo, a comissão é devida.',
    });
  }

  /* --- 3. queda da media de seis meses --- */
  const caindo = c.linhas.filter((l) => l.varMedia != null && l.varMedia <= -0.15 && l.fat12 > 0);
  if (caindo.length) {
    caindo.sort((a, b) => a.varMedia - b.varMedia);
    alertas.push({
      tipo: 'media',
      titulo: `${caindo.length} fábrica${caindo.length > 1 ? 's' : ''} com a média dos seis meses em queda`,
      texto: `${caindo.slice(0, 5).map((l) => '<b>' + esc(l.nome) + '</b> ' + Math.round(l.varMedia * 100) + '%').join(' · ')}.
        Queda por si só não é ilegal — mercado oscila. Vira assunto jurídico quando vem de ato da
        representada: zona reduzida, preço inviável, mix cortado.`,
      lei: 'Lei 4.886/65, art. 32, § 7º — vedadas alterações que reduzam a média dos últimos seis meses. E art. 36, "a" e "c", que fazem disso justa causa para o representante rescindir.',
    });
  }

  /* O alerta de "fabrica parada" (CC art. 715) saiu daqui.
   * Ele so faz sentido para representacao VIVA que parou de dar retorno. Como
   * a tela agora mostra so fabricas ativas - e as encerradas ja tiveram acerto
   * pago - ele acusaria sempre em falso. Se um dia uma ativa comecar a definhar,
   * quem avisa e o alerta de queda de media, que olha o mesmo fenomeno mais
   * cedo. */

  /* --- 5. base de calculo --- */
  if (c.descontamST || c.descontamIPI) {
    alertas.push({
      tipo: 'base',
      titulo: 'Imposto saindo da base da comissão',
      texto: `<b>${c.descontamST}</b> fábricas descontam ST e <b>${c.descontamIPI}</b> descontam IPI
        antes de calcular sua comissão, segundo o cadastro delas no Mercos. O campo de comissão do
        Mercos <b>não</b> reflete esse desconto — ele é faturamento × percentual. Ou seja: o que
        entra na conta é menor do que esta tela mostra, e a diferença só aparece no informe de
        rendimentos.`,
      lei: 'Lei 4.886/65, art. 32, § 4º — as comissões deverão ser calculadas pelo valor total das mercadorias. Há decisão nos dois sentidos sobre excluir imposto da base: é questão em aberto, não conclusão.',
    });
  }

  return alertas;
}

function renderVigia(c) {
  const A = calcVigia(c);
  if (!A.length) return '';
  return `<h3>Vigia</h3>
  <div class="sub">Alertas gerados da comparação entre os seus números e os prazos da lei.
    Cada um cita o artigo e mostra a conta. Nenhum conclui nada — apontam onde olhar.</div>
  ${A.map((a) => `<div class="fab">
    <div class="nome">${a.titulo}</div>
    <div style="font-size:13.5px;line-height:1.6;margin-top:6px">${a.texto}</div>
    <div class="anexo" style="border-top-style:dashed">${esc(a.lei)}</div>
  </div>`).join('')}`;
}


/* =====================================================================
 * ENCERRAMENTO DE REPRESENTACAO
 *
 * O momento em que uma fabrica desliga a BASP e o momento de maior valor e de
 * maior risco desta tela. Valor porque e quando o 1/12 de anos de trabalho vira
 * dinheiro. Risco porque quase tudo que se perde ali se perde por pressa: aceitar
 * proposta antes de conferir, assinar quitacao ampla, deixar prazo correr.
 *
 * Por isso o fluxo e deliberadamente lento:
 *   1. confirma que o desligamento e real (nada comeca por clique acidental)
 *   2. mostra o que cuidar ANTES de mostrar o dinheiro
 *   3. abre o calculo com a formula visivel, nao so o resultado
 *   4. deixa lancar a proposta da fabrica e compara com o minimo legal
 *   5. permite fechar parcial e continuar depois, com historico de rodadas
 *
 * O estado mora no servidor: negociacao dura semanas e o Bruno acompanha do
 * celular. Nada aqui e enviado para a fabrica - e caderno de anotacao, nao
 * canal de comunicacao.
 *
 * NAO E PARECER. A tela cita o artigo e mostra a conta; quem negocia e ele,
 * com advogado. O piso legal nao e teto: acordo pode ser maior.
 * ===================================================================== */

function encDe(nome) {
  return (state.encerramentos && state.encerramentos[nome]) || null;
}

async function salvarEncerramentos() {
  try {
    await fetch(getApiBase().replace(/\/$/, '') + '/api/juridico', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-token': getApiToken() },
      body: JSON.stringify({ apenasEncerramentos: true, encerramentos: state.encerramentos || {} }),
    });
  } catch (e) {
    alert('Não consegui salvar no servidor. O que você digitou está na tela, mas pode se perder ao fechar.');
  }
}

function iniciarEncerramento(nome) {
  const ok = confirm(
    'Você está realmente sendo desligado da fábrica ' + nome + '?\n\n'
    + 'Ao clicar em OK, o Copilot inicia o processo de cálculo e encerramento das atividades '
    + 'desta representação.\n\n'
    + 'Nada é enviado à fábrica. É o seu caderno de negociação.'
  );
  if (!ok) return;
  const hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
  if (!state.encerramentos) state.encerramentos = {};
  state.encerramentos[nome] = {
    iniciadoEm: hoje,
    status: 'aberto',
    comunicadoEm: '',
    proposta: { indenizacao: 0, aviso: 0, pendentes: 0, outros: 0 },
    rodadas: [],
    checklist: {},
  };
  salvarEncerramentos();
  state.tela = 'encerramento';
  state.fabricaEnc = nome;
  render();
}

function calcEncerramento(l) {
  const e = encDe(l.nome) || {};
  const p = e.proposta || {};
  const minimo = (l.umDoze || 0) + (l.aviso || 0);
  const ofertado = (Number(p.indenizacao) || 0) + (Number(p.aviso) || 0)
    + (Number(p.pendentes) || 0) + (Number(p.outros) || 0);
  const difIndeniz = (Number(p.indenizacao) || 0) - (l.umDoze || 0);
  const difAviso = (Number(p.aviso) || 0) - (l.aviso || 0);
  return { e, p, minimo, ofertado, difIndeniz, difAviso, dif: ofertado - minimo };
}

 *
 * COMO FUNCIONA. Nao e leitura de contrato: e conferencia contra uma lista de

function revisarContrato(texto, l) {
  const paras = String(texto || '').split(/\n\s*\n/);
  /* Compara sem acento e em minusculas: contrato vem escrito de todo jeito. */
  const norm = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const umDoze = fmt(l.umDoze).replace('R$ ', '');
  const aviso = fmt(l.aviso).replace('R$ ', '');
  const preencher = (t) => t.replace('{UMDOZE}', umDoze).replace('{AVISO}', aviso);

  const achados = [];
  const saida = [];

  paras.forEach((par) => {
    saida.push({ tipo: 'orig', texto: par });
    REGRAS_CONTRATO.filter((r) => r.quando === 'presente').forEach((r) => {
      if (!r.re.test(norm(par))) return;
      if (achados.some((a) => a.id === r.id)) return;   // uma vez por regra
      achados.push({ ...r, onde: 'no texto' });
      saida.push({ tipo: 'novo', texto: preencher(r.texto), regra: r });
    });
  });

  const ausentes = REGRAS_CONTRATO.filter((r) => r.quando === 'ausente' && !r.re.test(norm(texto)));
  ausentes.forEach((r) => {
    achados.push({ ...r, onde: 'faltando' });
    saida.push({ tipo: 'novo', texto: preencher(r.texto), regra: r, acrescentada: true });
  });

  return { saida, achados, ausentes: ausentes.length };
}


/* =====================================================================
 * CONTRATO VIGENTE DE CADA REPRESENTADA
 *
 * Os contratos que a BASP assinou ao longo dos anos foram assinados sem
 * revisao. Nao da para desfazer isso, mas da para SABER o que foi assinado -
 * e chegar numa eventual rescisao com a lista pronta do que sempre esteve
 * errado, em vez de descobrir na hora da briga.
 *
 * A VARREDURA cobre os artigos que protegem o representante, nao so os de
 * rescisao:
 *   art. 27      clausulas obrigatorias do contrato
 *   art. 31      zona e exclusividade
 *   art. 32      comissao: nascimento, prazo, base, reducao de media
 *   art. 33      prazo de recusa da proposta
 *   art. 34      aviso previo
 *   art. 35/36   justas causas, dos dois lados
 *   art. 37      retencao de comissao
 *   art. 39      foro
 *   art. 41/42   pluralidade de representadas e sub-representacao
 *   art. 43      del credere
 *   art. 44      falencia e prescricao
 *   art. 45      auxilio-doenca
 *   CC 715/716   asfixia e negocio frustrado por culpa do proponente
 *
 * LIMITE HONESTO: isto e conferencia por lista, nao leitura juridica. Nao
 * entende contexto nem clausula escrita de forma criativa. Serve para separar
 * o que precisa de olho humano do que esta evidentemente em ordem.
 * ===================================================================== */

const REGRAS_VIGENTE = [
  { id: 'zona', quando: 'ausente', re: /zona|territorio|regiao|area de atuacao/i,

function analisarVigente(texto) {
  const norm = String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const achados = [];
  REGRAS_VIGENTE.forEach((r) => {
    const tem = r.re.test(norm);
    if ((r.quando === 'presente' && tem) || (r.quando === 'ausente' && !tem)) achados.push(r);
  });
  return {
    achados,
    graves: achados.filter((a) => a.grave).length,
    analisadoEm: new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date()),
  };
}

function renderEncerramento() {
  const c = calcular();
  const l = c && c.linhas.find((x) => x.nome === state.fabricaEnc);
  if (!l) return '<div class="vazio">Fábrica não encontrada.</div>';
  const k = calcEncerramento(l);
  const e = k.e;
  const abertos = (l.vigia && l.vigia.abertos) || [];
  const somaAbertos = abertos.reduce((s, o) => s + (o.valor || 0), 0);

  const cor = k.ofertado === 0 ? 'neutro' : (k.dif >= 0 ? 'up' : 'down');

  return `<div class="topbar">
    <div class="brand">Encerramento<small>${esc(l.nome)}</small></div>
    <div><button class="btn btn-sm" id="btn-voltar">← Voltar</button></div>
  </div>

  <div class="tarja">
    <b>Processo de encerramento aberto em ${e.iniciadoEm ? e.iniciadoEm.split('-').reverse().join('/') : '--'}.</b>
    Isto é o seu caderno de negociação: nada daqui é enviado à fábrica. Os valores são calculados
    sobre faturamento × percentual, sem o desconto de IPI e ST que a fábrica aplica — confira com o
    informe de rendimentos antes de fechar. O piso legal <b>não é teto</b>: acordo pode ser maior.
  </div>

  <h3>1. O que você precisa cuidar agora</h3>
  <div class="sub">Marque conforme resolver. Fica salvo.</div>
  ${CUIDADOS.map((cd, i) => `<div class="fab">
    <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
      <input type="checkbox" data-cuidado="${i}" ${(e.checklist && e.checklist[i]) ? 'checked' : ''} style="margin-top:4px">
      <span>
        <div class="nome">${esc(cd.t)}</div>
        <div style="font-size:13.5px;line-height:1.6;margin-top:4px">${esc(cd.x)}</div>
        <div class="anexo" style="border-top-style:dashed">${esc(cd.lei)}</div>
      </span>
    </label>
    <input class="incons" data-incons="${i}" placeholder="Inconsistência encontrada neste item — o que precisa ser corrigido"
      value="${esc((e.inconsistencias && e.inconsistencias[i]) || '')}">
  </div>`).join('')}
  ${(() => {
    const abertas = Object.keys(e.inconsistencias || {}).filter((k) => (e.inconsistencias[k] || '').trim());
    return abertas.length ? `<div class="tarja"><b>${abertas.length} inconsistência(s) anotada(s)</b> —
      resolva antes de assinar: ${abertas.map((k) => esc(CUIDADOS[k] ? CUIDADOS[k].t : k)).join(' · ')}.</div>` : '';
  })()}

  <h3>2. O cálculo</h3>
  <div class="sub">Fórmula aberta, para você conferir na mão.</div>
  <div class="fab">
    <table>
      <tbody>
        <tr><td>Comissão de toda a representação<br><span class="neutro" style="font-size:12px">${fmt(l.totalFat)} × ${l.pct}% · desde ${l.primeiraData ? l.primeiraData.split('-').reverse().join('/') : '--'} · ${l.pedidos} pedidos</span></td>
            <td>${fmt(l.totalCom)}</td></tr>
        <tr><td><b>Indenização — 1/12</b><br><span class="neutro" style="font-size:12px">art. 27, "j" · piso legal, não teto</span></td>
            <td><b>${fmt(l.umDoze)}</b></td></tr>
        <tr><td><b>Aviso prévio</b><br><span class="neutro" style="font-size:12px">art. 34 · 1/3 das comissões dos 3 meses anteriores</span></td>
            <td><b>${fmt(l.aviso)}</b></td></tr>
        <tr><td><b>Mínimo legal</b></td><td><b>${fmt(k.minimo)}</b></td></tr>
        <tr><td>Propostas em aberto no sistema<br><span class="neutro" style="font-size:12px">${abertos.length} pedidos · art. 32, § 5º — vencem na data da rescisão</span></td>
            <td>${fmt(somaAbertos)}</td></tr>
      </tbody>
    </table>
  </div>

  <h3>3. A proposta da fábrica</h3>
  <div class="sub">Lance o que eles ofereceram. A comparação é automática.</div>
  <div class="fab">
    <div class="grade">
      <div class="cel"><div class="r">Indenização</div>
        <input class="btn" style="width:100%" type="number" step="0.01" data-prop="indenizacao" value="${k.p.indenizacao || ''}"></div>
      <div class="cel"><div class="r">Aviso prévio</div>
        <input class="btn" style="width:100%" type="number" step="0.01" data-prop="aviso" value="${k.p.aviso || ''}"></div>
      <div class="cel"><div class="r">Comissões pendentes</div>

    </div>

    <div class="grade" style="margin-top:12px">
      <div class="cel"><div class="r">Proposta total</div><div class="v">${fmt(k.ofertado)}</div></div>
      <div class="cel"><div class="r">Mínimo legal</div><div class="v">${fmt(k.minimo)}</div></div>
      <div class="cel"><div class="r">Diferença</div><div class="v ${cor}">${k.ofertado ? (k.dif >= 0 ? '+' : '') + fmt(k.dif) : '--'}</div></div>
    </div>

    ${k.ofertado && k.dif < 0 ? `<div class="tarja" style="margin-top:12px">
      A proposta está <b>${fmt(-k.dif)} abaixo</b> do piso do art. 27, "j" somado ao art. 34.
      ${k.difIndeniz < 0 ? 'A indenização oferecida está ' + fmt(-k.difIndeniz) + ' abaixo do 1/12. ' : ''}${k.difAviso < 0 ? 'O aviso prévio está ' + fmt(-k.difAviso) + ' abaixo. ' : ''}
      Isso não significa que seja ilegal fechar — significa que você está abrindo mão de valor que a
      lei garante como mínimo, e é bom saber quanto.
    </div>` : ''}
  </div>

  <h3>4. Fechamento</h3>
  <div class="sub">Registre cada rodada. Fechar parcial mantém o processo aberto.</div>
  <div class="fab">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="btn-parcial">Salvar rodada (parcial)</button>
      <button class="btn" id="btn-encerrar">Marcar negociação como encerrada</button>
      ${e.status === 'encerrado' ? '<button class="btn" id="btn-reabrir">Reabrir</button>' : ''}
    </div>
    <div class="anexo">Status: <b>${e.status === 'encerrado' ? 'encerrado' : 'em negociação'}</b>
      ${(e.rodadas || []).length ? '· ' + e.rodadas.length + ' rodada(s) registrada(s)' : ''}</div>
    ${(e.rodadas || []).slice().reverse().map((r) => `<div class="anexo">
      <b>${r.data.split('-').reverse().join('/')}</b> — proposta ${fmt(r.total)}
      (${r.dif >= 0 ? '+' : ''}${fmt(r.dif)} vs mínimo)${r.obs ? ' · ' + esc(r.obs) : ''}
    </div>`).join('')}
  </div>

  <h3>5. O contrato de encerramento</h3>
  <div class="sub">Cole o termo que a fábrica enviou. A revisão devolve o mesmo texto com as
    correções inseridas <i>em itálico</i> — tudo que estiver em itálico <b>não foi escrito por eles</b>.</div>
  <div class="fab">
    <textarea class="campo" id="contrato-texto" placeholder="Cole aqui o contrato de encerramento enviado pela fábrica">${esc(e.contrato || '')}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn" id="btn-revisar">Revisar contrato</button>
      ${e.revisado ? '<button class="btn" id="btn-copiar">Copiar revisão</button>' : ''}
    </div>
    <div class="anexo">Conferência contra a Lei 4.886/65 por lista de pontos, não leitura jurídica.
      Pode marcar cláusula inofensiva — cada inserção vem com o artigo ao lado para você julgar.
      <b>Não substitui advogado.</b></div>
  </div>
  ${e.revisado ? renderRevisao(e.revisado) : ''}`;
}

/* Dois blocos: o resumo do que foi mexido e o contrato reescrito. O resumo vem
 * antes porque e o que se le com pressa; o texto completo e para conferir e
 * copiar. */
function renderRevisao(rev) {
  const ins = rev.saida.filter((x) => x.tipo === 'novo');
  return `<div class="fab">
    <div class="nome">${ins.length} inserção(ões) sugerida(s)</div>
    <div class="sub" style="margin:6px 0 0">${rev.achados.map((a) => `<div style="padding:7px 0;border-top:1px dashed var(--border)">
      <b>${esc(a.titulo)}</b> · ${a.onde === 'faltando' ? 'não constava' : 'encontrado no texto'}<br>
      ${esc(a.porque)}<br><span class="neutro">${esc(a.lei)}</span>
    </div>`).join('')}</div>
  </div>

  <div class="contrato" id="contrato-revisado">${rev.saida.map((x) => (x.tipo === 'orig'
    ? `<p class="orig">${esc(x.texto)}</p>`
    : `<p class="novo">${esc(x.texto)}<small>${x.acrescentada ? 'Cláusula acrescentada' : 'Correção inserida'} · ${esc(x.regra.lei)}</small></p>`)).join('')}</div>`;
}


/* Eventos da tela de encerramento. Tudo que o Bruno digita vai para o servidor
 * assim que ele sai do campo - negociacao nao pode depender de ele lembrar de
 * apertar salvar. */
function ligarEncerramento() {
  const nome = state.fabricaEnc;
  const e = encDe(nome);
  if (!e) return;

  const v = document.getElementById('btn-voltar');
  if (v) v.addEventListener('click', () => { state.tela = 'lista'; state.fabricaEnc = null; render(); });

  document.querySelectorAll('[data-cuidado]').forEach((el) => {
    el.addEventListener('change', () => {
      if (!e.checklist) e.checklist = {};
      e.checklist[el.getAttribute('data-cuidado')] = el.checked;
      salvarEncerramentos();
    });
  });

  document.querySelectorAll('[data-prop]').forEach((el) => {
    el.addEventListener('change', () => {
      if (!e.proposta) e.proposta = {};
      e.proposta[el.getAttribute('data-prop')] = Number(el.value) || 0;
      salvarEncerramentos();
      render();
    });
  });

  const par = document.getElementById('btn-parcial');
  if (par) par.addEventListener('click', () => {
    const c = calcular();
    const l = c.linhas.find((x) => x.nome === nome);
    const k = calcEncerramento(l);
    const obs = prompt('Observação desta rodada (opcional):', '');
    if (obs === null) return;
    const hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
    if (!e.rodadas) e.rodadas = [];
    e.rodadas.push({ data: hoje, total: k.ofertado, dif: k.dif, obs: obs.trim() });
    e.status = 'aberto';
    salvarEncerramentos();
    render();
  });

  const enc = document.getElementById('btn-encerrar');
  if (enc) enc.addEventListener('click', () => {
    if (!confirm('Marcar a negociação com ' + nome + ' como encerrada?\n\nO histórico fica guardado e você pode reabrir.')) return;
    e.status = 'encerrado';
    salvarEncerramentos();
    render();
  });

  const re = document.getElementById('btn-reabrir');
  if (re) re.addEventListener('click', () => { e.status = 'aberto'; salvarEncerramentos(); render(); });

  document.querySelectorAll('[data-incons]').forEach((el) => {
    el.addEventListener('change', () => {
      if (!e.inconsistencias) e.inconsistencias = {};
      e.inconsistencias[el.getAttribute('data-incons')] = el.value.trim();
      salvarEncerramentos();
      render();
    });
  });

  const rev = document.getElementById('btn-revisar');
  if (rev) rev.addEventListener('click', () => {
    const ta = document.getElementById('contrato-texto');
    const txt = (ta.value || '').trim();
    if (!txt) { alert('Cole o texto do contrato antes de revisar.'); return; }
    if (txt.length > 80000) { alert('Contrato muito longo. Cole por partes.'); return; }
    const c = calcular();
    const l = c.linhas.find((x) => x.nome === nome);
    e.contrato = txt;
    e.revisado = revisarContrato(txt, l);
    e.revisadoEm = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
    salvarEncerramentos();
    render();
  });

  const cop = document.getElementById('btn-copiar');
  if (cop) cop.addEventListener('click', () => {
    const el = document.getElementById('contrato-revisado');
    if (!el) return;
    navigator.clipboard.writeText(el.innerText).then(
      () => alert('Revisão copiada. O que estava em itálico virou texto comum — marque no editor antes de enviar.'),
      () => alert('Não consegui copiar. Selecione o texto na tela.')
    );
  });
}


function ctrDe(nome) { return (state.contratos && state.contratos[nome]) || null; }

async function salvarContratos() {
  try {
    await fetch(getApiBase().replace(/\/$/, '') + '/api/juridico', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-token': getApiToken() },
      body: JSON.stringify({ apenasContratos: true, contratos: state.contratos || {} }),
    });
  } catch (e) {
    alert('Não consegui salvar no servidor.');
  }
}

function renderContrato() {
  const c = calcular();
  const l = c && c.linhas.find((x) => x.nome === state.fabricaCtr);
  if (!l) return '<div class="vazio">Fábrica não encontrada.</div>';
  const ct = ctrDe(l.nome) || {};
  const an = ct.analise;

  return `<div class="topbar">
    <div class="brand">Contrato<small>${esc(l.nome)}</small></div>
    <div><button class="btn btn-sm" id="btn-voltar-ctr">← Voltar</button></div>
  </div>

  ${ct.texto ? '' : '<div class="tarja" style="border-color:#c05c52;background:rgba(192,92,82,.12)"><b>Esta fábrica não tem contrato registrado.</b> Represente-a há ' + (l.primeiraData ? l.primeiraData.slice(0,4) : '--') + ' sem instrumento escrito significa que, numa rescisão, tudo se discute do zero. Use o modelo abaixo para propor a formalização.</div>'}

  <h3>Contrato vigente</h3>
  <div class="sub">Cole o contrato que está assinado hoje. Ele não vai ser alterado — a análise serve
    para você saber, <b>antes</b> de uma rescisão, o que foi assinado sem orientação.</div>
  <div class="fab">
    <textarea class="campo" id="ctr-texto" placeholder="Cole aqui o contrato assinado com esta fábrica">${esc(ct.texto || '')}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn" id="btn-analisar">Analisar contra a lei</button>
      <button class="btn" id="btn-modelo">${ct.texto ? 'Ver modelo ideal' : 'Gerar modelo para assinatura'}</button>
    </div>
    ${ct.analisadoEm ? '<div class="anexo">Analisado em ' + ct.analisadoEm.split('-').reverse().join('/') + '</div>' : ''}
  </div>

  ${an ? `<h3>${an.achados.length} ponto(s) encontrado(s)${an.graves ? ' · ' + an.graves + ' grave(s)' : ''}</h3>
  <div class="sub">Conferência por lista contra os artigos protetivos. Não é leitura jurídica —
    serve para separar o que precisa de olho humano.</div>
  ${an.achados.map((a) => `<div class="fab" style="${a.grave ? 'border-color:#c05c52' : ''}">
    <div class="nome">${a.grave ? '<span class="down">●</span> ' : ''}${esc(a.titulo)}</div>
    <div style="font-size:13.5px;line-height:1.6;margin-top:5px">${esc(a.porque)}</div>
    <div class="anexo" style="border-top-style:dashed">${esc(a.lei)}</div>
  </div>`).join('')}` : ''}

  ${ct.modelo ? `<h3>Modelo de contrato</h3>
  <div class="sub">O art. 27 cumprido alínea por alínea, com os dados desta fábrica já preenchidos.
    Leve a um advogado antes de enviar — é ponto de partida, não peça pronta.</div>
  <div class="fab"><button class="btn" id="btn-copiar-modelo">Copiar modelo</button></div>
  <div class="contrato" id="modelo-texto">${esc(ct.modelo)}</div>` : ''}`;
}

function ligarContrato() {
  const nome = state.fabricaCtr;
  if (!state.contratos) state.contratos = {};
  if (!state.contratos[nome]) state.contratos[nome] = {};
  const ct = state.contratos[nome];

  const v = document.getElementById('btn-voltar-ctr');
  if (v) v.addEventListener('click', () => { state.tela = 'lista'; state.fabricaCtr = null; render(); });

  const an = document.getElementById('btn-analisar');
  if (an) an.addEventListener('click', () => {
    const ta = document.getElementById('ctr-texto');
    const txt = (ta.value || '').trim();
    if (!txt) { alert('Cole o texto do contrato antes de analisar.'); return; }
    ct.texto = txt.slice(0, 80000);
    const r = analisarVigente(ct.texto);
    ct.analise = r;
    ct.analisadoEm = r.analisadoEm;
    salvarContratos();
    render();
  });

  const mo = document.getElementById('btn-modelo');
  if (mo) mo.addEventListener('click', () => {
    const c = calcular();
    const l = c.linhas.find((x) => x.nome === nome);
    ct.modelo = modeloContrato(l);
    salvarContratos();
    render();
  });

  const cp = document.getElementById('btn-copiar-modelo');
  if (cp) cp.addEventListener('click', () => {
    navigator.clipboard.writeText(ct.modelo || '').then(
      () => alert('Modelo copiado.'),
      () => alert('Não consegui copiar. Selecione o texto na tela.')
    );
  });
}

function render() {
  const app = document.getElementById('app');

  if (state.tela === 'contrato' && state.fabricaCtr) {
    app.innerHTML = renderContrato();
    ligarContrato();
    return;
  }

  if (state.tela === 'encerramento' && state.fabricaEnc) {
    app.innerHTML = renderEncerramento();
    ligarEncerramento();
    return;
  }

  const topo = `<div class="topbar">
    <div class="brand">BASP Copilot<small>Jurídico</small></div>
    <div>
      <a class="btn btn-sm" href="./index.html">← Módulos</a>
      <button class="btn btn-sm" id="btn-recarregar">⟳ Atualizar</button>
    </div>
  </div>`;

  if (state.erro) {
    app.innerHTML = topo + `<div class="vazio">${esc(state.erro)}</div>`;
    ligar();
    return;
  }
  if (!state.jur) { app.innerHTML = topo + '<div class="vazio">Carregando…</div>'; return; }

  const c = calcular();
  if (!c || !c.linhas.length) {
    app.innerHTML = topo + `<div class="vazio">Ainda não chegaram os dados jurídicos do Mercos.
      Eles entram na primeira sincronização do dia — se demorar, a extensão do Chrome está parada.</div>`;
    ligar();
    return;
  }

  const anexos = lerAnexos();

  app.innerHTML = topo + `
  <div class="tarja">
    <b>Comissão do Mercos, ainda não confrontada com o informe de rendimentos.</b>
    Cada pedido traz o campo de comissão do sistema — que, conferido pedido a pedido, é
    simplesmente <b>faturamento × percentual do cadastro na época</b>. Ele tem a vantagem de usar
    o percentual histórico correto, e não o de hoje. Mas atenção ao que ele <b>não</b> faz:
    <b>não desconta IPI nem ST</b>, embora 16 fábricas descontem esses impostos na hora de pagar.
    Então o valor real recebido tende a ser <b>menor</b> do que o mostrado aqui — e essa diferença
    é justamente o assunto do art. 32, § 4º. Só o informe de rendimentos fecha a conta.
    Nada nesta tela serve para cobrança antes disso.
  </div>

  ${c.semFiltro ? '<div class="tarja"><b>Não consegui carregar a lista de fábricas ativas.</b> Esta tela está mostrando todas as representadas que já faturaram, inclusive as encerradas e já acertadas. Recarregue para filtrar.</div>' : ''}

  ${(() => {
    const sem = c.linhas.filter((l) => { const t = ctrDe(l.nome); return !t || !t.texto; });
    if (!sem.length) return '';
    return '<div class="tarja" style="border-color:#c05c52;background:rgba(192,92,82,.12)">'
      + '<b>' + sem.length + ' de ' + c.linhas.length + ' fábricas ativas sem contrato registrado:</b> '
      + sem.map((l) => esc(l.nome)).join(' · ')
      + '. Sem instrumento escrito, numa rescisão tudo se discute do zero — inclusive a data de início, '
      + 'que é a base do 1/12. Abra cada uma e gere o modelo para propor a formalização.</div>';
  })()}

  <div class="cards">
    <div class="kpi"><div class="rot">Acerto total estimado</div>
      <div class="val">${curto(c.somaAcerto)}</div>
      <div class="pe">se todas desligassem hoje</div></div>
    <div class="kpi"><div class="rot">Comissão histórica</div>
      <div class="val">${curto(c.totalComissaoHistorica)}</div>
      <div class="pe">estimada, desde o início</div></div>
    <div class="kpi"><div class="rot">Comissão 12 meses</div>
      <div class="val">${curto(c.comissao12)}</div>
      <div class="pe">estimada</div></div>
    <div class="kpi"><div class="rot">Base de cálculo</div>
      <div class="val down">${c.descontamST}</div>
      <div class="pe">fábricas descontam ST · ${c.descontamIPI} descontam IPI</div></div>
  </div>

  <h3>Se a fábrica desligar hoje</h3>
  <div class="sub">${c.encerradas ? '<b>' + c.encerradas + ' representações encerradas ficaram de fora</b> — o acerto delas já foi feito. ' : ''}Acerto = 1/12 da comissão de toda a representação (art. 27, "j") + aviso prévio
    de 1/3 das comissões dos três meses anteriores (art. 34). A data de início vem do primeiro
    pedido no Mercos enquanto o contrato não for anexado — o que <b>subestima</b> quem começou
    antes do sistema. As barrinhas são os últimos 24 meses de faturamento.</div>
  ${c.linhas.map((l) => renderFabrica(l, anexos)).join('')}

  ${renderVigia(c)}

  <h3>Base de cálculo da comissão</h3>
  <div class="sub">O art. 32, § 4º da Lei 4.886/65 diz que as comissões devem ser calculadas
    <b>pelo valor total das mercadorias</b>. O cadastro do Mercos mostra que
    ${c.descontamST} fábricas descontam ST e ${c.descontamIPI} descontam também IPI antes de
    calcular sua comissão. <b>Isso é uma divergência conhecida, não uma conclusão:</b> há decisão
    nos dois sentidos sobre excluir imposto da base. É o ponto de maior valor potencial aqui e o
    primeiro a levar a um advogado — com o informe de rendimentos na mão, não com esta tela.</div>

  <div class="rolagem"><table>
    <thead><tr><th>Fábrica</th><th>%</th><th>Desconta</th><th>Faturamento total</th><th>Comissão estimada</th></tr></thead>
    <tbody>${c.linhas.map((l) => `<tr>
      <td>${esc(l.nome)}</td>
      <td>${l.pct != null ? l.pct.toFixed(2).replace('.', ',') : '--'}</td>
      <td>${[l.meta.descontaIPI ? 'IPI' : '', l.meta.descontaST ? 'ST' : ''].filter(Boolean).join(' + ') || '--'}</td>
      <td>${fmt(l.totalFat)}</td>
      <td>${fmt(l.totalCom)}</td>
    </tr>`).join('')}</tbody>
  </table></div>

  <div class="nota">Atualizado ${c.atualizadoEm ? new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo', dateStyle: 'short', timeStyle: 'short',
  }).format(new Date(c.atualizadoEm)) : '--'} · o levantamento jurídico roda uma vez por dia.
  Prescrição de cinco anos (art. 44, parágrafo único) corre sobre cada parcela não paga.</div>`;

  ligar();
}

function ligar() {
  const b = document.getElementById('btn-recarregar');
  if (b) b.addEventListener('click', carregar);
  document.querySelectorAll('[data-contrato]').forEach((el) => {
    el.addEventListener('click', () => {
      state.fabricaCtr = el.getAttribute('data-contrato');
      state.tela = 'contrato';
      render();
    });
  });
  document.querySelectorAll('[data-encerrar]').forEach((el) => {
    el.addEventListener('click', () => {
      const nome = el.getAttribute('data-encerrar');
      if (encDe(nome)) { state.tela = 'encerramento'; state.fabricaEnc = nome; render(); return; }
      iniciarEncerramento(nome);
    });
  });
  document.querySelectorAll('[data-anexo]').forEach((el) => {
    el.addEventListener('click', () => {
      const nome = el.getAttribute('data-anexo');
      const a = lerAnexos();
      const atual = a[nome] || {};
      const contrato = prompt('Contrato de ' + nome + ' — nome ou local do arquivo (vazio para limpar):', atual.contrato || '');
      if (contrato === null) return;
      const inicio = prompt('Data de início no contrato (AAAA-MM-DD) — vazio usa o 1º pedido:', atual.inicio || '');
      if (inicio === null) return;
      const informe = prompt('Informe de rendimentos — nome ou local do arquivo:', atual.informe || '');
      if (informe === null) return;
      a[nome] = { contrato: contrato.trim(), inicio: inicio.trim(), informe: informe.trim() };
      salvarAnexos(a);
      render();
    });
  });
}

async function carregar() {
  state.erro = null; state.jur = null; render();
  try {
    state.jur = await apiFetch('/api/juridico');
    state.encerramentos = (state.jur && state.jur.encerramentos) || {};
    state.contratos = (state.jur && state.jur.contratos) || {};
  } catch (e) {
    state.erro = e.message || 'Não foi possível carregar o jurídico.';
  }
  /* Fabricas ativas vem da analise de vendas: so quem faturou nos ultimos 12
   * meses entra na soma do acerto total. Falhar aqui nao derruba a tela. */
  try {
    const an = await apiFetch('/api/fabricas/analise');
    state.ativas = (an.fabricas || []).filter((f) => (f.total12 || 0) > 0).map((f) => f.nome);
  } catch (e) { state.ativas = null; }
  render();
}

carregar();
</script>
</body>
</html>
