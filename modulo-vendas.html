<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BASP · Análise de Vendas</title>
<style>
  :root{
    --bg:#faf7f0; --card:#fffdf8; --ink:#241f19; --ink-soft:#7d7263;
    --border:#e6ddc9; --gold:#b8934f; --gold-light:#d9bd82;
    --up:#2f7d4f; --down:#b3341f; --flat:#8a8069; --new:#1a6a8f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  #app{max-width:1000px;margin:0 auto;padding:18px 18px 90px}
  a{color:inherit}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    padding-bottom:12px;border-bottom:1px solid var(--border)}
  .brand{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .brand small{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);letter-spacing:.02em}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--ink);
    padding:8px 13px;border-radius:8px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--gold)}
  .btn-primary{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
  .btn-sm{padding:5px 10px;font-size:12.5px}
  .nota{font-size:12px;color:var(--ink-soft);margin-top:8px}
  /* ===== SELO DE IDADE DO DADO =====
   * Entre 2 e 9 de agosto de 2026 o sync nao rodou nenhuma vez e esta tela
   * continuou mostrando numeros com cara de novos. Quem le no carro nao tem
   * como desconfiar. Este selo existe para que dado velho nunca mais pareca
   * novo: ele fica no topo, antes de qualquer numero, e muda de cor sozinho.
   * Nao usar `geradoEm` da analise aqui - aquilo e a hora em que o servidor
   * recalculou, e sobe todo dia mesmo sem nenhum contato com o Mercos. */
  .idade-dado{display:flex;align-items:center;gap:9px;margin:12px 0 0;
    padding:9px 12px;border-radius:9px;font-size:13px;
    border:1px solid var(--border);background:var(--card);color:var(--ink-soft)}
  .idade-dado .pt{width:8px;height:8px;border-radius:50%;flex:none;background:#3fa66a}
  .idade-dado b{color:var(--ink);font-weight:600}
  .idade-dado.atencao{border-color:#c99a3e;background:rgba(201,154,62,.10);color:var(--ink)}
  .idade-dado.atencao .pt{background:#c99a3e}
  .idade-dado.alerta{border-color:#c05c52;background:rgba(192,92,82,.12);color:var(--ink)}
  .idade-dado.alerta .pt{background:#c05c52;animation:pulsa 1.8s ease-in-out infinite}
  @keyframes pulsa{0%,100%{opacity:1}50%{opacity:.25}}
  /* ===== O MES POR DENTRO ===== */
  .mes{margin:16px 0 0;padding:18px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
  .mes h3{margin:0 0 2px;font-size:17px;letter-spacing:.01em}
  .mes .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;line-height:1.5}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:18px}
  .kpi{padding:12px 13px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.02)}
  .kpi .rot{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .kpi .val{font-size:23px;font-weight:700;margin:5px 0 3px;letter-spacing:-.02em}
  .kpi .pe{font-size:12px;color:var(--ink-soft);line-height:1.45}
  .kpi.destaque{border-color:var(--gold)}
  .up{color:#4fbf7e}.down{color:#e0796d}.neutro{color:var(--ink-soft)}

  .barras{width:100%;height:190px;display:block;margin-bottom:6px}
  .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-bottom:18px}
  .leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .fab-linha{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline;
    padding:9px 0;border-top:1px solid var(--border)}
  .fab-linha .nome{font-size:13.5px;font-weight:600}
  .fab-linha .num{font-size:12.5px;color:var(--ink-soft);text-align:right;white-space:nowrap}
  .fab-linha .trilho{grid-column:1/-1;height:7px;border-radius:4px;background:rgba(255,255,255,.06);
    position:relative;overflow:hidden}
  .fab-linha .trilho i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--gold)}
  .fab-linha .trilho u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-soft);opacity:.75}

  .rm{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
  .rm h4{margin:0 0 4px;font-size:15px}
  .rm .lead{font-size:13.5px;line-height:1.65;color:var(--ink);margin-bottom:14px}
  .rm .bloco{padding:12px 0;border-top:1px dashed var(--border)}
  .rm .bt{font-size:13.5px;font-weight:700;margin-bottom:4px}
  .rm .bx{font-size:13.5px;line-height:1.6;color:var(--ink)}
  .rm .conta{margin-top:14px;padding:13px 14px;border:1px solid var(--gold);border-radius:10px;
    background:rgba(210,175,120,.07);font-size:13.5px;line-height:1.65}
  .rm b{font-weight:700}

  .acoes{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
  .acao{display:flex;gap:10px;padding:9px 0;font-size:13.5px;line-height:1.5}
  .acao .mk{flex:none;width:6px;height:6px;border-radius:50%;margin-top:7px;background:var(--gold)}
  .acao b{font-weight:600}

  .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
  .rbox{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 13px}
  .rbox .rot{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
  .rbox .val{font-size:19px;font-weight:700;margin-top:3px}
  .rbox .sub{font-size:12px;color:var(--ink-soft)}

  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
  .chip{border:1px solid var(--border);background:var(--card);border-radius:99px;
    padding:6px 12px;font-size:12.5px;cursor:pointer}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}

  .fcard{background:var(--card);border:1px solid var(--border);border-radius:11px;
    padding:13px 15px;margin-bottom:10px;cursor:pointer}
  .fcard:hover{border-color:var(--gold)}
  .fcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .fnome{font-weight:700;font-size:15.5px}
  .fvar{font-weight:700;font-size:15px;white-space:nowrap}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)} .new{color:var(--new)}
  .fsub{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
  .barra{height:6px;background:#efe6d2;border-radius:99px;margin-top:9px;overflow:hidden;display:flex}
  .barra i{display:block;height:100%}
  .barra .a{background:linear-gradient(90deg,var(--gold),var(--gold-light))}
  .barra .b{background:#d8cdb4}
  .selo{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
    border:1px solid var(--border);color:var(--ink-soft);margin-left:6px}

  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600}
  td.num,th.num{text-align:right;white-space:nowrap}
  tr.clicavel{cursor:pointer}
  tr.clicavel:hover td{background:#fdf9ef}

  .sec{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin:12px 0}
  .sec h3{margin:0 0 4px;font-size:14px;letter-spacing:.01em}
  .sec .desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px}
  .lista{font-size:13.5px}
  .lista div{padding:5px 0;border-bottom:1px solid var(--border)}
  .lista div:last-child{border-bottom:0}
  .lista .cid{color:var(--ink-soft);font-size:12px}

  .acao{border-left:3px solid var(--gold);background:#fffdf6;border-radius:0 9px 9px 0;
    padding:11px 14px;margin-bottom:10px}
  .acao h4{margin:0 0 5px;font-size:14px}
  .acao p{margin:0 0 7px;font-size:13.5px}
  .pensador{font-size:12.5px;color:var(--ink-soft);border-top:1px dashed var(--border);padding-top:6px}
  .pensador b{color:var(--ink)}
  .urg{border-left-color:var(--down)}
  .opo{border-left-color:var(--new)}

  .pf{display:inline-flex;gap:4px}
  .pf b{cursor:pointer;user-select:none;border:1px solid var(--border);background:var(--card);
    border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--ink-soft)}
  .pf b.on{background:var(--gold);border-color:var(--gold);color:#fff}
  .sug{font-size:11.5px;color:var(--ink-soft)}
  .sug em{font-style:normal;color:var(--gold)}
  .salvar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--border);
    display:flex;gap:10px;align-items:center}
  .vazio{color:var(--ink-soft);font-size:13.5px;padding:10px 0}
  .carregando{text-align:center;padding:50px 0;color:var(--ink-soft)}
  .erro{background:#fdeceb;border:1px solid #e8b4ac;color:#8c2a1a;
    padding:12px 14px;border-radius:9px;font-size:13.5px}

  .mapa-det{margin-top:10px;padding:10px 12px;border-radius:9px;
    background:rgba(210,175,120,.10);border:1px solid var(--border);
    display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;align-items:baseline}
  .mapa-det b{font-size:14.5px}
  .mapa-det .cid{color:var(--ink-soft);font-size:11.5px;font-weight:400}

  .legenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:12px;
    color:var(--ink-soft)}
  .legenda .lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .legenda .lg i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
  .legenda .lg i.esc{width:26px;height:13px;border-radius:4px}
  .pt-marca{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}

  /* ===== PAINEL GRAFICO ===== */
  .mapa{width:100%;height:auto;display:block;margin-top:6px;border-radius:10px}
  .mapa .pt{cursor:pointer}
  .mapa .pt:hover circle{opacity:.85}
  .serie{width:100%;height:auto;display:block;margin-top:6px}
  .uf-linha{display:grid;grid-template-columns:38px 1fr auto auto;gap:9px;align-items:center;
    padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px}
  .uf-linha:last-child{border-bottom:0}
  .uf-nome{font-weight:700;letter-spacing:.04em}
  .uf-barra{height:8px;background:rgba(245,240,232,.08);border-radius:99px;overflow:hidden}
  .uf-barra i{display:block;height:100%;border-radius:99px}
  .uf-val{font-variant-numeric:tabular-nums;white-space:nowrap}
  .uf-var{font-weight:700;white-space:nowrap;min-width:56px;text-align:right}
  .mx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.mx{border-collapse:separate;border-spacing:3px;font-size:11.5px}
  .mx th{font-weight:600;color:var(--ink-soft);text-transform:none;letter-spacing:0}
  .mx-fab{text-align:left;white-space:nowrap;padding-right:8px;max-width:132px;overflow:hidden;
    text-overflow:ellipsis;border-bottom:0}
  .mx-cid{height:74px;vertical-align:bottom;border-bottom:0}
  .mx-cid span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
  .mx-cel{width:30px;height:26px;border-radius:5px;text-align:center;color:var(--text-muted);
    border-bottom:0;padding:0}
  .desc b.up{color:var(--up)} .desc b.down{color:var(--down)}
  .desc b.flat{color:var(--flat)} .desc b.new{color:var(--new)}

  @media (max-width:720px){
    #app{padding:14px 12px 80px}
    .brand{font-size:17px}
    table{font-size:12.5px}
    th,td{padding:7px 4px}
    .esconde-cel{display:none}
  }
</style>

<body>
<div id="app"><div class="carregando">Carregando a análise…</div></div>

<script>
/* =====================================================================
 * BASP Copilot - MODULO ANALISE DE VENDAS
 *
 * Modulo proprio, no mesmo nivel de Rotas e Marketing - nao e um anexo do
 * Rotas. A primeira visao e por fabrica; o modulo nasceu para crescer
 * (produto, vendedor, sazonalidade) sem mexer no Rotas.
 *
 * Responde: qual fabrica esta crescendo, qual esta caindo, EM QUE CIDADE
 * isso acontece, com QUAL lojista - e o que fazer.
 *
 * A conta pesada (12 meses contra os 12 anteriores, mes a mes, por fabrica e
 * por cidade) roda no servidor, em /api/fabricas/analise. Aqui e so leitura e
 * decisao.
 *
 * O plano de acao NAO e texto decorativo: cada recomendacao nasce de uma regra
 * sobre os numeros desta fabrica, e vem ancorada em quem pensou aquilo antes.
 * ===================================================================== */

const DEFAULT_API_BASE = 'https://basp-rotas-api.onrender.com';
const API_BASE_KEY = 'basp_rotas_api_base_v1';
const API_TOKEN_KEY = 'basp_rotas_api_token_v1';

function getApiBase() { return localStorage.getItem(API_BASE_KEY) || DEFAULT_API_BASE; }
function getApiToken() { return (localStorage.getItem(API_TOKEN_KEY) || '').trim(); }

async function apiFetch(path) {
  const base = getApiBase().replace(/\/$/, '');
  const res = await fetch(base + path, {
    headers: { 'Content-Type': 'application/json', 'x-api-token': getApiToken() },
  });
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  if (!res.ok) throw new Error((body && body.error) || ('Erro ' + res.status + ' ao falar com o servidor.'));
  return body;
}

const state = { dados: null, erro: null, tela: 'lista', fabrica: null, cidade: null, filtro: 'todas',
  perfis: null, rascunho: null, salvando: false, msg: null, mapaSel: null, mapaCor: 'tendencia', malhas: null,
  meta: null, indic: null };

/* ---------- formatacao ---------- */
const fmtMoney = (n) => (n == null ? '--' :
  'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const fmtCurto = (n) => {
  if (n == null) return '--';
  const v = Number(n);
  if (Math.abs(v) >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (Math.abs(v) >= 1e3) return 'R$ ' + (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil';
  return fmtMoney(v);
};
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function classeTend(t) {
  return t === 'crescimento' ? 'up' : t === 'queda' || t === 'parou' ? 'down'
    : t === 'nova' ? 'new' : 'flat';
}
function textoVar(f) {
  if (f.tendencia === 'nova') return 'nova';
  if (f.tendencia === 'parou') return 'parou';
  if (f.variacao == null) return '--';
  return (f.variacao > 0 ? '+' : '') + f.variacao.toLocaleString('pt-BR') + '%';
}

/* =====================================================================
 * PLANO DE ACAO
 *
 * Cada regra olha um numero real desta fabrica e devolve uma recomendacao.
 * A atribuicao e honesta: o que esta entre aspas e citacao; o resto e o
 * princípio do autor resumido em uma linha. Nao invento frase de ninguem.
 * ===================================================================== */

function planoDaFabrica(f) {
  const acoes = [];
  const perdidos = f.perdidos || [];
  const quedas = f.quedas || [];
  const novos = f.novos || [];
  const oport = f.oportunidades || [];
  const cidadesEmQueda = (f.cidades || []).filter((c) => c.tendencia === 'queda' || c.tendencia === 'parou');
  const cidadesCrescendo = (f.cidades || []).filter((c) => c.tendencia === 'crescimento' || c.tendencia === 'nova');
  const perdaReais = perdidos.reduce((s, p) => s + (p.anterior || 0), 0)
    + quedas.reduce((s, p) => s + ((p.anterior || 0) - (p.atual || 0)), 0);

  /* 1. Encarar o número antes de explicá-lo */
  if (f.tendencia === 'queda' || f.tendencia === 'parou') {
    acoes.push({
      tipo: 'urg',
      titulo: 'Encare a queda antes de justificá-la',
      texto: `Esta fábrica caiu de ${fmtMoney(f.total12ant)} para ${fmtMoney(f.total12)} — `
        + `${textoVar(f)} em 12 meses. Antes de falar em mercado, crise ou preço, `
        + `identifique <b>onde exatamente</b> o dinheiro sumiu: são `
        + `${perdidos.length} loja(s) que pararam e ${quedas.length} que reduziram forte. `
        + `Isso dá ${fmtMoney(perdaReais)} de perda rastreável. O resto é hipótese.`,
      autor: 'Jack Welch',
      frase: '"Encare a realidade como ela é, não como você gostaria que fosse."',
      contexto: 'GE. Diagnóstico honesto antes de plano de ação.',
    });
  }

  /* 2. Recuperar quem parou custa menos que conquistar */
  if (perdidos.length) {
    const top = perdidos.slice(0, 3).map((p) => `${p.cliente} (${fmtCurto(p.anterior)})`).join(', ');
    acoes.push({
      tipo: 'urg',
      titulo: `${perdidos.length} loja(s) compravam e pararam`,
      texto: `Maiores: ${esc(top)}. Estas lojas já conheciam o produto, já tinham `
        + `mostruário e já tinham vendido. Recuperar cliente que parou custa uma fração `
        + `de abrir cliente novo — e a conversa começa de um lugar melhor: "sumiu por quê?".`,
      autor: 'Marcelo Caetano',
      frase: null,
      contexto: 'Gestão de carteira: crescer dentro da carteira que já se tem é o caminho mais barato de crescimento.',
    });
  }

  /* 3. Perguntar em vez de argumentar */
  if (quedas.length) {
    acoes.push({
      tipo: '',
      titulo: `${quedas.length} loja(s) reduziram mais de 30%`,
      texto: 'Queda sem parada costuma ser troca de fornecedor em silêncio — a loja '
        + 'substituiu parte do mix. Não chegue defendendo a fábrica. Pergunte o que mudou '
        + 'na exposição, o que entrou no lugar e o que o consumidor final passou a pedir. '
        + 'Deixe o lojista dimensionar o próprio problema em voz alta.',
      autor: 'Neil Rackham',
      frase: null,
      contexto: 'SPIN Selling: em venda complexa, perguntas de implicação vendem mais que argumentos.',
    });
  }

  /* 4. Oportunidade concreta: elegível que nunca comprou */
  if (oport.length) {
    const cidades = [...new Set(oport.map((o) => o.cidade))].slice(0, 4).join(', ');
    acoes.push({
      tipo: 'opo',
      titulo: `${oport.length} loja(s) marcadas como elegíveis e que nunca compraram`,
      texto: `Concentradas em ${esc(cidades)}. Você já disse que esta fábrica cabe nessas lojas — `
        + 'falta a conversa. Não chegue com catálogo: chegue com o que você aprendeu vendendo '
        + 'esta fábrica em lojas parecidas na mesma praça. Informação que o lojista não tem vale '
        + 'mais que desconto.',
      autor: 'Matthew Dixon e Brent Adamson',
      frase: null,
      contexto: 'The Challenger Sale: o vendedor que mais vende é o que ensina algo novo sobre o negócio do cliente.',
    });
  }

  /* 5. Onde está crescendo: repetir o que funciona */
  if (cidadesCrescendo.length && f.total12 > 0) {
    const c = cidadesCrescendo[0];
    acoes.push({
      tipo: '',
      titulo: `${esc(c.cidade)} está puxando para cima`,
      texto: `${esc(c.cidade)} fez ${fmtMoney(c.total12)} contra ${fmtMoney(c.total12ant)}. `
        + 'Antes de tentar consertar a praça ruim, descubra o que está sendo feito de diferente '
        + 'aqui — que produto puxa, que argumento pega, que prazo destrava — e leve isso '
        + 'para as outras cidades. Padrão que funciona se copia.',
      autor: 'Raul Candeloro',
      frase: null,
      contexto: 'Gestão de vendas por indicadores: medir para descobrir o que repetir.',
    });
  }

  /* 6. Cidade em queda com carteira viva */
  if (cidadesEmQueda.length) {
    const c = cidadesEmQueda[0];
    acoes.push({
      tipo: 'urg',
      titulo: `${esc(c.cidade)} está drenando o resultado`,
      texto: `${esc(c.cidade)}: ${fmtMoney(c.total12)} contra ${fmtMoney(c.total12ant)}. `
        + `${c.perdidos.length} loja(s) pararam nesta praça. Uma cidade inteira caindo raramente `

/* ===== IDADE DO DADO =====
 *
 * A pergunta que esta tela precisa responder antes de qualquer numero:
 * "isso aqui e de agora ou de semana passada?"
 *
 * A fonte e `meta.lastSync` - o instante em que a extensao falou com o Mercos
 * pela ultima vez. NAO e `geradoEm` da analise: aquele campo e a hora em que o
 * servidor recalculou o cache e sobe todo dia mesmo com o PC do escritorio
 * desligado. Foi exatamente essa confusao que deixou a tela parecer viva
 * durante os nove dias de agosto em que nada sincronizou.
 *
 * Faixas: ate 2h e rotina; ate 24h e normal mas ja vale dizer a hora; passou
 * de 24h vira ambar; passou de 72h vira vermelho piscando, porque a essa
 * altura a causa quase sempre e uma so - o PC do escritorio esta desligado.
 */
function idadeDoDado() {
  const m = state.meta || {};

  /* ===== POR QUE ESTE SELO MUDOU EM 31/08/2026 =====
   *
   * Ele lia `meta.lastSync` - a hora da ULTIMA TENTATIVA de sincronizar. Só
   * que tentar nao e conseguir. Em 22/08 o token do GitHub expirou e a API
   * parou de GRAVAR: a extensao continuou buscando no Mercos a cada 10
   * minutos, o `lastSync` continuou avancando na memoria do servidor, e o
   * selo seguiu dizendo "agora mesmo" por NOVE DIAS enquanto a tela mostrava
   * numeros de 22/08. R$ 256 mil de venda invisiveis.
   *
   * A licao: o selo tem que medir a idade do NUMERO QUE ESTA NA TELA, nao a
   * idade da ultima tentativa. Entao a fonte passa a ser
   * `indicadores.atualizadoEm` - o instante em que o dado exibido foi de fato
   * gravado.
   *
   * E a distancia entre os dois vira diagnostico: se o sistema tenta ha horas
   * e nao grava, isso tem nome e aparece em vermelho. */
  const gravado = (state.indic && state.indic.atualizadoEm) || null;
  const tentado = m.lastSync || null;

  if (gravado && tentado) {
    const atraso = new Date(tentado).getTime() - new Date(gravado).getTime();
    if (atraso > 3 * 3600 * 1000) {
      const h = Math.floor(atraso / 3600000);
      const d = Math.floor(h / 24);
      const quanto = d >= 1 ? (d + (d > 1 ? ' dias' : ' dia')) : (h + 'h');
      const q = new Intl.DateTimeFormat('pt-BR', {
        timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
      }).format(new Date(gravado));
      return {
        nivel: 'alerta',
        texto: '<b>Sincronizando mas não gravando há ' + quanto + '.</b> Os números abaixo são de '
          + q + ' e não avançam. Causa quase sempre a mesma: credencial do servidor expirada.',
        quando: new Date(gravado),
      };
    }
  }

  const iso = gravado || tentado;
  if (!iso) return { nivel: 'alerta', texto: 'Nunca sincronizado com o Mercos.', quando: null };

  const quando = new Date(iso);
  if (isNaN(quando)) return { nivel: 'alerta', texto: 'Data do último sync ilegível.', quando: null };

  const min = Math.max(0, Math.round((Date.now() - quando.getTime()) / 60000));
  const horas = min / 60;

  /* Hora local de Sao Paulo, sempre - nunca toISOString, que joga o dia para
   * tras depois das 21h e faz "hoje" virar "ontem" na tela do Bruno. */
  const hora = new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit',
  }).format(quando);
  const dia = new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit',
  }).format(quando);

  if (horas < 2) {
    const q = min < 1 ? 'agora mesmo' : min < 60 ? `há ${min} min` : 'há 1 hora';
    return { nivel: 'ok', texto: `Dados do Mercos <b>${q}</b> · ${hora}`, quando };
  }
  if (horas < 24) {
    /* Menos de 24h nao quer dizer "hoje": as 3h da manha, um sync das 23h de
     * ontem tem 4 horas de idade e ainda assim e de ontem. Comparar o dia do
     * calendario em Sao Paulo, nunca so a diferenca em horas. */
    const diaDe = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(d);
    const rotulo = diaDe(quando) === diaDe(new Date(Date.now())) ? 'hoje' : 'ontem';
    return { nivel: 'ok', texto: `Dados do Mercos de <b>${rotulo}, ${hora}</b>`, quando };
  }

  const dias = Math.floor(horas / 24);
  if (horas < 72) {
    return {
      nivel: 'atencao',
      texto: `Dados de <b>${dia}, ${hora}</b> — ${dias} dia${dias > 1 ? 's' : ''} sem sincronizar. `
        + 'Os números abaixo não incluem o que a Gisele lançou depois disso.',
      quando,
    };
  }
  return {
    nivel: 'alerta',
    texto: `<b>${dias} dias sem sincronizar</b> (último: ${dia}, ${hora}). `
      + 'Não decida visita por esta tela. Quase sempre é o PC do escritório desligado.',
    quando,
  };
}

/* ===== O MES POR DENTRO =====
 *
 * Vinha faltando a pergunta que o Bruno faz todo dia na estrada: quanto entrou
 * hoje, quanto ja tem no mes, e isso esta acima ou abaixo do normal. A tela so
 * sabia responder em janela de 12 meses.
 *
 * DE ONDE VEM O OBJETIVO. O Mercos nao tem meta cadastrada - objetivo_do_dia
 * e objetivo_do_mes voltam nulos. Entao a regua nasce do proprio historico:
 * a media do MESMO MES nos 3 anos anteriores, fabrica a fabrica.
 *
 * Tres anos, e nao todos os disponiveis, por decisao do Bruno em 10/08/2026:
 * agosto de 2021 fez R$ 2,9 mi contra R$ 832 mil em 2025. Misturar os dois
 * cria o alvo de uma empresa que nao existe mais, e o painel viraria derrota
 * diaria - numero que desanima nao corrige rota.
 *
 * SEM DESCONTAR FIM DE SEMANA, tambem por decisao dele: sabado e domingo
 * represam pedido que a Gisele lanca na segunda. Tirar esses dias da conta
 * inflaria o objetivo diario e faria toda segunda parecer fracasso.
 *
 * SO FABRICAS ATIVAS entram no alvo. Cobrar receita que nao tem como voltar e
 * inventar divida. "Ativa" aqui e a mesma definicao do resto do modulo:
 * faturou nos ultimos 12 meses. A definicao mora num lugar so.
 *
 * A PROJECAO NAO E PROMESSA. tendencia e regra de tres do ritmo ate agora.
 * No dia 3 ela oscila muito; a tela avisa isso em vez de fingir precisao.
 */

/* Nomes vem de duas fontes: o widget do Mercos manda a razao social
 * ("DELTA MOVEIS INTERIORES LTDA") e a analise usa o nome curto. Sem esta
 * normalizacao a Delta aparece como fabrica sem objetivo e o alvo do mes sai
 * menor do que e. */
function chaveFab(nome) {
  return String(nome || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .replace(/\b(LTDA|ME|EPP|EIRELI|S\/?A)\b/g, '')
    .replace(/[^A-Z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function calcMes() {
  const ind = state.indic;
  if (!ind || ind.vazio || !Array.isArray(ind.dias) || !ind.dias.length) return null;

  const hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
  const diaHoje = Number(hoje.slice(8, 10));
  const doMesAtual = ind.mes === hoje.slice(0, 7);

  const dias = ind.dias.slice().sort((a, b) => (a.dia < b.dia ? -1 : 1));
  const diasDoMes = (ind.base && ind.base.diasDoMes) || dias.length;
  const corridos = doMesAtual ? Math.min(diaHoje, diasDoMes) : diasDoMes;

  const ate = (n) => dias.slice(0, n).reduce((s, d) => s + (d.valor || 0), 0);
  const acumulado = ate(corridos);
  const hojeValor = (dias.find((d) => d.dia === hoje) || {}).valor || 0;

  const anoPassadoMes = dias.reduce((s, d) => s + (d.anoPassado || 0), 0);
  const anoPassadoAte = dias.slice(0, corridos).reduce((s, d) => s + (d.anoPassado || 0), 0);

  /* Ativas: as que a propria analise ja mostra com faturamento nos 12 meses. */
  const ativas = new Set(
    ((state.dados && state.dados.fabricas) || [])
      .filter((f) => (f.total12 || 0) > 0)
      .map((f) => chaveFab(f.nome))
  );

  const realizadoPorFab = {};
  (ind.fabricas || []).forEach((f) => { realizadoPorFab[chaveFab(f.nome)] = (realizadoPorFab[chaveFab(f.nome)] || 0) + (f.valor || 0); });

  const base = (ind.base && ind.base.fabricas) || [];
  const linhas = [];
  const vistos = new Set();
  base.forEach((b) => {
    const k = chaveFab(b.nome);
    if (!ativas.has(k)) return;              // fabrica que parou nao gera alvo
    vistos.add(k);
    linhas.push({ nome: b.nome, alvo: b.media || 0, feito: realizadoPorFab[k] || 0 });
  });
  /* Vendeu este mes mas nao tem historico no mesmo mes: entra com alvo zero,
   * senao some da tela justamente quem esta trazendo dinheiro novo. */
  (ind.fabricas || []).forEach((f) => {
    const k = chaveFab(f.nome);
    if (vistos.has(k)) return;
    vistos.add(k);
    linhas.push({ nome: f.nome, alvo: 0, feito: f.valor || 0 });
  });
  linhas.sort((a, b) => (b.alvo + b.feito) - (a.alvo + a.feito));

  const objetivoMes = linhas.reduce((s, l) => s + l.alvo, 0);
  const objetivoDia = diasDoMes ? objetivoMes / diasDoMes : 0;
  const esperadoAte = objetivoDia * corridos;
  const tendencia = corridos ? (acumulado / corridos) * diasDoMes : 0;
  const faltam = Math.max(0, diasDoMes - corridos);
  const precisaPorDia = faltam ? Math.max(0, objetivoMes - acumulado) / faltam : 0;

  return {
    mes: ind.mes, dias, diasDoMes, corridos, faltam, doMesAtual,
    hojeValor, acumulado, objetivoMes, objetivoDia, esperadoAte, tendencia, precisaPorDia,
    anoPassadoMes, anoPassadoAte, linhas, anos: (ind.base && ind.base.anos) || [],
    atualizadoEm: ind.atualizadoEm || null,
  };
}

/* Barras do mes: uma coluna por dia. Barra cheia e o realizado; o traco claro
 * atras e o mesmo dia do ano passado; a linha horizontal e o objetivo diario.
 * Dias futuros ficam so com a sombra do ano passado - da para ver o que
 * costuma vir pela frente sem fingir que ja veio. */
function renderBarras(m) {
  const L = 26, R = 8, T = 10, B = 20, W = 700, H = 190;
  const larg = (W - L - R) / m.diasDoMes;
  const teto = Math.max(
    ...m.dias.map((d) => Math.max(d.valor || 0, d.anoPassado || 0)),
    m.objetivoDia * 1.4, 1
  );
  const y = (v) => T + (H - T - B) * (1 - v / teto);

  const cols = m.dias.map((d, i) => {
    const x = L + i * larg;
    const n = Number(d.dia.slice(8, 10));
    const passou = !m.doMesAtual || n <= m.corridos;
    const w = Math.max(2, larg - 3);
    const ap = d.anoPassado || 0;
    const at = d.valor || 0;
    const cor = at >= m.objetivoDia ? '#4fbf7e' : '#c9a24a';
    return `
      ${ap ? `<rect x="${x + 1}" y="${y(ap)}" width="${w}" height="${H - B - y(ap)}" fill="currentColor" opacity=".13" rx="2"/>` : ''}
      ${passou && at ? `<rect x="${x + 1}" y="${y(at)}" width="${w}" height="${H - B - y(at)}" fill="${cor}" rx="2"/>` : ''}
      ${n % 5 === 0 || n === 1 ? `<text x="${x + larg / 2}" y="${H - 6}" font-size="9" fill="currentColor" opacity=".55" text-anchor="middle">${n}</text>` : ''}`;
  }).join('');

  return `<svg class="barras" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="Venda dia a dia do mes">
    ${cols}
    <line x1="${L}" x2="${W - R}" y1="${y(m.objetivoDia)}" y2="${y(m.objetivoDia)}"
      stroke="currentColor" stroke-opacity=".5" stroke-dasharray="4 4"/>
    <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="currentColor" stroke-opacity=".25"/>
  </svg>`;
}

/* O que fazer. Cada frase nasce de uma comparacao entre dois numeros desta
 * tela - nada de conselho generico. Se nao houver nada digno de nota, e melhor
 * a lista vir curta do que inventar recomendacao. */
function acoesDoMes(m) {
  const A = [];
  const dif = m.acumulado - m.esperadoAte;

  if (m.faltam && m.precisaPorDia > 0) {
    A.push(`Faltam <b>${m.faltam} dia${m.faltam > 1 ? 's' : ''}</b> e <b>${fmtMoney(Math.max(0, m.objetivoMes - m.acumulado))}</b> para igualar a média dos ${m.anos.length} anos. Dá <b>${fmtMoney(m.precisaPorDia)} por dia</b> — hoje o ritmo é ${fmtMoney(m.corridos ? m.acumulado / m.corridos : 0)}.`);
  }

  const paradas = m.linhas.filter((l) => l.alvo > 0 && l.feito === 0).sort((a, b) => b.alvo - a.alvo).slice(0, 3);
  if (paradas.length) {
    A.push(`Sem <u>nenhum</u> pedido este mês, mas com histórico: <b>${paradas.map((p) => p.nome).join(', ')}</b>. Só a primeira vale ${fmtMoney(paradas[0].alvo)} de média — é a maior alavanca isolada da tela.`);
  }

  const atrasadas = m.linhas
    .filter((l) => l.alvo > 0 && l.feito > 0 && l.feito < l.alvo * (m.corridos / m.diasDoMes) * 0.7)
    .sort((a, b) => (b.alvo - b.feito) - (a.alvo - a.feito)).slice(0, 3);
  if (atrasadas.length) {
    A.push(`Abaixo do próprio ritmo: ${atrasadas.map((f) => `<b>${f.nome}</b> (${fmtCurto(f.feito)} de ${fmtCurto(f.alvo)})`).join(' · ')}.`);
  }

  const adiante = m.linhas.filter((l) => l.alvo > 0 && l.feito >= l.alvo).sort((a, b) => (b.feito - b.alvo) - (a.feito - a.alvo)).slice(0, 2);
  if (adiante.length) {
    A.push(`Já passaram a média do mês inteiro: ${adiante.map((f) => `<b>${f.nome}</b> (${fmtCurto(f.feito)})`).join(' · ')}. Vale entender o que mudou aí e repetir nas outras praças.`);
  }

  const novas = m.linhas.filter((l) => l.alvo === 0 && l.feito > 0);
  if (novas.length) {
    A.push(`Receita nova, sem histórico neste mês: ${novas.map((f) => `<b>${f.nome}</b> (${fmtCurto(f.feito)})`).join(' · ')}. Não estava no alvo e entrou mesmo assim.`);
  }

  if (m.anoPassadoAte) {
    const v = Math.round(((m.acumulado - m.anoPassadoAte) / m.anoPassadoAte) * 100);
    A.push(`Contra o mesmo trecho do ano passado: <b class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : ''}${v}%</b> (${fmtCurto(m.acumulado)} contra ${fmtCurto(m.anoPassadoAte)}).`);
  }

  if (dif < 0 && m.corridos <= 3) {
    A.push('Só passaram poucos dias do mês — a projeção ainda balança muito. Não vale mudar rota por ela ainda.');
  }
  return A;
}

/* ===== RESUMO DO MES =====
 *
 * O mesmo texto que eu escrevia na conversa, agora gerado pela tela e refeito
 * a cada leitura. Cada bloco nasce de uma comparacao entre numeros desta
 * pagina - nenhuma frase e fixa.
 *
 * ATRIBUICAO HONESTA, a mesma regra do plano por fabrica: o que esta entre
 * aspas e citacao real; o resto e o principio do autor resumido em uma linha.
 * Nao invento frase de ninguem.
 *
 * O bloco de conquistas vem PRIMEIRO quando existe. Painel que so cobra vira
 * painel que nao se abre.
 */

/* Dias uteis que ainda restam. O objetivo se espalha pelos 31 dias (decisao do
 * Bruno: fim de semana represa e cai na segunda), mas na hora de planejar a
 * agenda o que importa e quantos dias de trabalho sobraram de verdade. */
function diasUteisRestantes(m) {
  let n = 0;
  for (let d = m.corridos + 1; d <= m.diasDoMes; d += 1) {
    const dt = new Date(m.mes + '-' + String(d).padStart(2, '0') + 'T12:00:00Z');
    const s = dt.getUTCDay();
    if (s !== 0 && s !== 6) n += 1;
  }
  return n;
}

function renderResumo(m) {
  const B = [];
  const falta = Math.max(0, m.objetivoMes - m.acumulado);
  const deficit = m.esperadoAte - m.acumulado;
  const uteis = diasUteisRestantes(m);
  const comMovimento = m.dias.slice(0, m.corridos).filter((d) => (d.valor || 0) > 0).length;
  const semMovimento = m.corridos - comMovimento;
  const porUtil = uteis ? falta / uteis : 0;

  const linhas = m.linhas.filter((l) => l.alvo > 0);
  const gaps = linhas.map((l) => ({ ...l, gap: Math.max(0, l.alvo - l.feito) }))
    .sort((a, b) => b.gap - a.gap);

  /* --- conquistas: o que ja foi batido --- */
  const batidas = linhas.filter((l) => l.feito >= l.alvo);
  const diasAcima = m.dias.slice(0, m.corridos).filter((d) => (d.valor || 0) >= m.objetivoDia).length;
  const varAno = m.anoPassadoAte ? Math.round(((m.acumulado - m.anoPassadoAte) / m.anoPassadoAte) * 100) : null;

  const conq = [];
  if (batidas.length) {
    conq.push(`<b>${batidas.length} fábrica${batidas.length > 1 ? 's' : ''} já bateu a meta do mês inteiro</b>: `
      + batidas.map((l) => `${esc(l.nome)} (${fmtCurto(l.feito)} de ${fmtCurto(l.alvo)})`).join(' · ') + '.');
  }
  const quase = linhas.filter((l) => l.feito < l.alvo && l.feito >= l.alvo * 0.9);
  if (quase.length) {
    conq.push(`A menos de 10% da meta: ${quase.map((l) => `<b>${esc(l.nome)}</b> (falta ${fmtCurto(l.alvo - l.feito)})`).join(' · ')}.`);
  }
  if (diasAcima) {
    conq.push(`<b>${diasAcima} de ${m.corridos} dias</b> fecharam acima do objetivo diário de ${fmtCurto(m.objetivoDia)}.`);
  }
  if (varAno != null && varAno > 0) {
    conq.push(`Contra o mesmo trecho do ano passado: <b class="up">+${varAno}%</b> — ${fmtCurto(m.acumulado)} contra ${fmtCurto(m.anoPassadoAte)}.`);
  }
  if (m.acumulado >= m.objetivoMes) {
    conq.unshift('<b>A meta do mês já foi batida.</b> O que entrar daqui pra frente sobe a régua dos próximos anos — esta média vira o objetivo deste mês no ano que vem.');
  }

  /* --- 1. onde o mes esta --- */
  const lead = `Dia <b>${m.corridos} de ${m.diasDoMes}</b>, restam <b>${m.faltam} dias</b> (${uteis} úteis). `
    + `Realizado <b>${fmtMoney(m.acumulado)}</b> de uma meta de <b>${fmtMoney(m.objetivoMes)}</b>`
    + ` — ${Math.round((m.acumulado / (m.objetivoMes || 1)) * 100)}% do caminho. `
    + (deficit > 0
      ? `Está <b class="down">${fmtMoney(deficit)} abaixo</b> do esperado para esta altura do mês. `
      : `Está <b class="up">${fmtMoney(-deficit)} acima</b> do esperado para esta altura do mês. `)
    + `No ritmo de hoje o mês fecha em <b>${fmtMoney(m.tendencia)}</b>.`;

  if (varAno != null && varAno > 0 && m.tendencia < m.objetivoMes) {
    B.push({
      t: 'Dois números que parecem se contradizer',
      x: `Você está <b class="up">+${varAno}%</b> sobre o ano passado e <b class="down">${Math.round((1 - m.tendencia / m.objetivoMes) * 100)}% abaixo</b> da média de ${m.anos.length} anos. `
        + `Não é contradição: ${Math.min(...m.anos)}–${Math.max(...m.anos)} inclui anos melhores que o último. `
        + 'Crescer sobre o ano mais fraco não significa ter voltado ao normal.',
      autor: 'Jack Welch', frase: '"Encare a realidade como ela é, não como você gostaria que fosse."',
      ctx: 'GE. Diagnóstico honesto antes do plano de ação.',
    });
  }

  /* --- 2. ritmo x cobertura --- */
  if (semMovimento && comMovimento) {
    B.push({
      t: `${semMovimento} de ${m.corridos} dias sem nenhum lançamento`,
      x: `Os ${fmtMoney(m.acumulado)} saíram de <b>${comMovimento} dias</b> com movimento — `
        + `${fmtMoney(m.acumulado / comMovimento)} por dia trabalhado. `
        + `Para fechar a meta faltam ${fmtMoney(falta)} em <b>${uteis} dias úteis</b>, ou ${fmtMoney(porUtil)} por dia. `
        + (porUtil <= (m.acumulado / comMovimento) * 1.1
          ? 'O ritmo por dia trabalhado já está no ponto — o que falta é ocupar os dias vazios.'
          : 'Além de ocupar os dias vazios, cada dia precisa render mais do que vem rendendo.'),
      autor: 'John H. Patterson', frase: null,
      ctx: 'NCR: vender é gestão de praça — território, cota e roteiro, não sorte.',
    });
  }

  /* --- 3. concentracao --- */
  const ord = m.linhas.slice().sort((a, b) => b.feito - a.feito).filter((l) => l.feito > 0);
  const top = ord.slice(0, 4);
  const somaTop = top.reduce((s, l) => s + l.feito, 0);
  const pctTop = m.acumulado ? Math.round((somaTop / m.acumulado) * 100) : 0;
  if (pctTop >= 65 && top.length) {
    const esgotadas = top.filter((l) => l.alvo && l.feito >= l.alvo * 0.95);
    B.push({
      t: `${top.length} fábricas respondem por ${pctTop}% do mês`,
      x: `${top.map((l) => `${esc(l.nome)} (${fmtCurto(l.feito)})`).join(', ')}. `
        + 'Se uma delas travar na segunda quinzena não há reserva para compensar. '
        + (esgotadas.length
          ? `E ${esgotadas.map((e) => esc(e.nome)).join(', ')} já está praticamente no teto da própria média — não tem de onde crescer neste mês.`
          : 'Vale confirmar pedido em carteira antes de contar com elas.'),
      autor: 'Aaron Ross', frase: null,
      ctx: 'Predictable Revenue: receita previsível vem de processo de entrada, não de poucas fontes grandes.',
    });
  }

  /* --- 4. o maior buraco isolado --- */
  const maior = gaps[0];
  if (maior && maior.gap > 0 && maior.feito < maior.alvo * 0.4) {
    B.push({
      t: `${esc(maior.nome)} é o maior buraco isolado: ${fmtMoney(maior.gap)}`,
      x: `Média histórica de ${fmtMoney(maior.alvo)} neste mês e apenas ${fmtMoney(maior.feito)} até agora `
        + `(${Math.round((maior.feito / maior.alvo) * 100)}%). Isso não é oscilação, é ausência. `
        + 'Antes de atribuir a mercado ou preço, abra esta fábrica no módulo e veja <b>quais lojas</b> '
        + 'compravam neste mês e não compraram. A perda é rastreável loja a loja; o resto é hipótese.',
      autor: 'Jack Welch', frase: null,
      ctx: 'Diagnóstico antes de explicação.',
    });
  }

  /* --- 5. zeradas com historico --- */
  const zeradas = gaps.filter((g) => g.feito === 0);
  if (zeradas.length) {
    const soma = zeradas.reduce((s, z) => s + z.alvo, 0);
    B.push({
      t: `${zeradas.length} fábrica${zeradas.length > 1 ? 's' : ''} sem um único pedido, todas com histórico`,
      x: `${zeradas.map((z) => `${esc(z.nome)} (${fmtCurto(z.alvo)})`).join(' · ')} — ${fmtMoney(soma)} de média somada. `
        + `Só ${esc(zeradas[0].nome)} vale ${fmtMoney(zeradas[0].alvo)}. `
        + 'Reativar quem já comprou custa menos que qualquer prospecção nova, e é a maior alavanca disponível na segunda quinzena.',
      autor: 'Marcelo Caetano', frase: null,
      ctx: 'Gestão de carteira: crescer dentro da carteira que já se tem é o caminho mais barato.',
    });
  }

  /* --- 6. presentes mas fracas --- */
  /* O maior buraco ja tem bloco proprio - repetir aqui so dilui. */
  const fracas = gaps.filter((g) => g.feito > 0 && g.feito < g.alvo * 0.2
    && !(maior && g.nome === maior.nome));
  if (fracas.length) {
    B.push({
      t: `${fracas.length} fábrica${fracas.length > 1 ? 's' : ''} com movimento, mas abaixo de 20% da meta`,
      x: `${fracas.map((f) => `<b>${esc(f.nome)}</b> (${Math.round((f.feito / f.alvo) * 100)}%)`).join(' · ')}. `
        + 'Pior sinal que zero: houve contato e o volume não veio. Queda sem parada costuma ser troca de '
        + 'fornecedor em silêncio. Não pergunte se está tudo bem — pergunte o que mudou no mix da loja.',
      autor: 'Neil Rackham', frase: null,
      ctx: 'SPIN Selling: em venda complexa, pergunta de implicação abre mais que argumento.',
    });
  }

  /* --- 7. as que estao no ritmo ---
   * "No ritmo" e quem esta no passo do calendario. Quem ja passou de 90% da
   * media do mes inteiro nao esta no ritmo - esta adiantada, e aparece nas
   * conquistas. Misturar as duas coisas esconde as duas. */
  const proporcao = m.corridos / m.diasDoMes;
  const noRitmo = linhas.filter((l) => l.feito >= l.alvo * proporcao && l.feito < l.alvo * 0.9);
  if (noRitmo.length >= 2) {
    B.push({
      t: `${noRitmo.length} fábricas exatamente no ritmo do mês`,
      x: `${noRitmo.map((l) => `${esc(l.nome)} (${Math.round((l.feito / l.alvo) * 100)}%)`).join(' · ')}. `
        + 'Estão onde deveriam estar no dia ' + m.corridos + '. Vale entender <b>por que</b> essas estão no ritmo '
        + 'e as outras não — a resposta costuma ser frequência de visita, não produto.',
      autor: 'Raul Candeloro', frase: null,
      ctx: 'Gestão por indicadores: medir para descobrir o que repetir.',
    });
  }

  /* --- 8. a tentacao do desconto --- */
  if (falta > 0 && m.tendencia < m.objetivoMes * 0.95) {
    B.push({
      t: 'Sobre a pressão de fechar o mês',
      x: `Faltando ${fmtMoney(falta)}, a saída curta é preço. Desconto para bater o mês rebaixa a base do mês `
        + 'seguinte e contamina a média dos próximos anos — inclusive esta régua, que é feita da sua própria história.',
      autor: 'Thiago Concer', frase: null,
      ctx: 'Desconto é a saída de quem não construiu valor antes.',
    });
  }

  /* --- a conta que fecha --- */
  let conta = '';
  if (falta > 0) {
    const acum = [];
    let soma = 0;
    for (const g of gaps) {
      if (soma >= falta * 0.6 || acum.length >= 4) break;
      acum.push(g); soma += g.gap;
    }
    conta = `<b>A conta que fecha o mês.</b> Faltam ${fmtMoney(falta)} em ${m.faltam} dias `
      + `(${fmtMoney(m.faltam ? falta / m.faltam : 0)} por dia corrido, ${fmtMoney(porUtil)} por dia útil). `
      + (acum.length
        ? `Se ${acum.map((a) => esc(a.nome)).join(', ')} voltarem à média histórica, sozinhas trazem `
          + `<b>${fmtMoney(soma)}</b> — ${Math.round((soma / falta) * 100)}% do que falta. `
          + 'O mês não se resolve empurrando quem já vai bem: ele se resolve em '
          + `${acum.length} nome${acum.length > 1 ? 's' : ''}.`
        : '');
  } else {
    conta = `<b>Meta do mês alcançada.</b> ${fmtMoney(m.acumulado)} contra ${fmtMoney(m.objetivoMes)} de objetivo, `
      + `com ${m.faltam} dia(s) ainda pela frente.`;
  }

  return `<div class="rm">
    <h4>Resumo do mês</h4>
    <div class="lead">${lead}</div>
    ${conq.length ? `<div class="bloco"><div class="bt up">✔ O que já foi conquistado</div>
      <div class="bx">${conq.map((c) => `• ${c}`).join('<br>')}</div></div>` : ''}
    ${B.map((b) => `<div class="bloco">
      <div class="bt">${b.t}</div>
      <div class="bx">${b.x}</div>
      <div class="pensador"><b>${esc(b.autor)}</b>${b.frase ? ' — ' + esc(b.frase) : ''}${b.ctx ? ' · ' + esc(b.ctx) : ''}</div>
    </div>`).join('')}
    <div class="conta">${conta}</div>
    <div class="nota">Refeito a cada abertura da tela, com os números do momento.
      Entre aspas é citação; o resto é o princípio do autor resumido.</div>
  </div>`;
}

function renderMes() {
  const m = calcMes();
  if (!m) {
    return `<div class="mes"><h3>O mês por dentro</h3>
      <div class="sub">Ainda não chegaram os indicadores diários do Mercos. Eles entram na próxima
      sincronização — se demorar, é sinal de que a extensão do Chrome está parada.</div></div>`;
  }

  const dif = m.acumulado - m.esperadoAte;
  const pct = m.objetivoMes ? Math.round((m.acumulado / m.objetivoMes) * 100) : 0;
  const clsDif = dif >= 0 ? 'up' : 'down';
  const clsTend = m.tendencia >= m.objetivoMes ? 'up' : 'down';
  const nomeMes = new Intl.DateTimeFormat('pt-BR', { month: 'long', timeZone: 'UTC' })
    .format(new Date(m.mes + '-15T12:00:00Z'));

  const fabs = m.linhas.filter((l) => l.alvo > 0 || l.feito > 0).slice(0, 14).map((l) => {
    const teto = Math.max(l.alvo, l.feito, 1);
    const pf = Math.min(100, (l.feito / teto) * 100);
    const pa = Math.min(100, (l.alvo / teto) * 100);
    const razao = l.alvo ? Math.round((l.feito / l.alvo) * 100) : null;
    const bateu = l.alvo > 0 && l.feito >= l.alvo;
    return `<div class="fab-linha">
      <div class="nome">${bateu ? '<span class="up">✔</span> ' : ''}${esc(l.nome)}</div>
      <div class="num">${fmtCurto(l.feito)}${l.alvo ? ` <span class="neutro">de ${fmtCurto(l.alvo)}</span>` : ' <span class="neutro">sem alvo</span>'}${razao != null ? ` · <span class="${razao >= 100 ? 'up' : razao >= 60 ? 'neutro' : 'down'}">${razao}%</span>` : ''}</div>
      <div class="trilho"><i style="width:${pf}%"></i>${l.alvo ? `<u style="left:${pa}%"></u>` : ''}</div>
    </div>`;
  }).join('');

  return `<div class="mes">
    <h3>O mês por dentro — ${esc(nomeMes)}</h3>
    <div class="sub">O objetivo não vem do Mercos: lá não existe meta cadastrada. Ele é a média deste
      mesmo mês em ${m.anos.join(', ')}, fábrica a fábrica, contando só as que ainda vendem, dividida
      pelos ${m.diasDoMes} dias. Sábado e domingo contam como dia normal — o que represa no fim de
      semana entra na segunda.</div>

    <div class="kpis">
      <div class="kpi destaque"><div class="rot">Hoje</div>
        <div class="val">${fmtCurto(m.hojeValor)}</div>
        <div class="pe">objetivo do dia ${fmtCurto(m.objetivoDia)}</div></div>
      <div class="kpi"><div class="rot">Acumulado do mês</div>
        <div class="val">${fmtCurto(m.acumulado)}</div>
        <div class="pe ${clsDif}">${dif >= 0 ? '+' : ''}${fmtCurto(dif)} vs o esperado até o dia ${m.corridos}</div></div>
      <div class="kpi"><div class="rot">Objetivo do mês</div>
        <div class="val">${fmtCurto(m.objetivoMes)}</div>
        <div class="pe">${pct}% alcançado</div></div>
      <div class="kpi"><div class="rot">Tendência de fechamento</div>
        <div class="val ${clsTend}">${fmtCurto(m.tendencia)}</div>
        <div class="pe">projeção pelo ritmo, não promessa</div></div>
    </div>

    ${renderBarras(m)}
    <div class="leg">
      <span><i style="background:#4fbf7e"></i>dia acima do objetivo</span>
      <span><i style="background:#c9a24a"></i>dia abaixo</span>
      <span><i style="background:currentColor;opacity:.2"></i>mesmo dia do ano passado</span>
      <span>— — objetivo diário</span>
    </div>

    <div class="rot" style="font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px">Fábrica a fábrica neste mês</div>
    ${fabs}

    ${renderResumo(m)}
  </div>`;
}

/* ===== Perfis: alto padrão x médio padrão =====
 * Marcar fábrica por cliente seriam 240 x 23 = mais de 5 mil decisões. Aqui são
 * 263: o perfil de cada lado. A elegibilidade vira o cruzamento dos dois.
 * Os dois lados aceitam A e B ao mesmo tempo - loja grande tem dois pisos,
 * fábrica tem duas linhas.
 */
function chaveP(tipo, id) { return tipo + '|' + id; }

function valorPerfil(tipo, item) {
  const r = state.rascunho || {};
  const k = chaveP(tipo, tipo === 'fab' ? item.nome : item.logId);
  if (r[k] !== undefined) return r[k];
  return item.atual || item.sugerido || [];
}

function botoesPerfil(tipo, item, nomes) {
  const v = valorPerfil(tipo, item);
  const id = tipo === 'fab' ? item.nome : item.logId;
  return `<span class="pf" data-tipo="${tipo}" data-id="${encodeURIComponent(id)}">
    <b class="${v.includes('A') ? 'on' : ''}" data-p="A" title="${esc(nomes.A)}">A</b>
    <b class="${v.includes('B') ? 'on' : ''}" data-p="B" title="${esc(nomes.B)}">B</b>
  </span>`;
}

function renderPerfis() {
  const p = state.perfis;
  if (!p) return `${renderTopo()}<div class="carregando">Carregando os perfis…</div>`;
  const nomes = p.nomes || { A: 'Alto padrão', B: 'Médio padrão' };

  const linha = (tipo, item) => `<tr>
    <td>${esc(tipo === 'fab' ? item.nome : item.nome)}</td>
    <td class="num esconde-cel">${fmtCurto(item.ticket)}</td>
    <td class="num"><span class="sug">${item.atual ? 'marcado' : '<em>sugerido</em>'}</span></td>
    <td class="num">${botoesPerfil(tipo, item, nomes)}</td>
  </tr>`;

  return `${renderTopo()}
  <div style="margin:14px 0 6px"><button class="btn btn-sm" id="btn-voltar">← Fábricas</button></div>
  <h2 style="margin:8px 0 2px;font-size:21px">Perfis de cliente e fábrica</h2>

  <div class="sec">
    <div class="desc" style="margin:0">
      <b>A = ${esc(nomes.A)}</b> · <b>B = ${esc(nomes.B)}</b>. Pode marcar os dois — loja com
      dois pisos, fábrica com duas linhas.<br>
      Com isso, oportunidade só aparece quando a fábrica cabe no perfil da loja.
      Loja de alto padrão comprando fábrica de médio padrão não vira cobrança: é
      <b>venda corporativa</b> (obra, clínica, apartamento decorado), um canal à parte.<br>
      <span class="sug">Sugestão pelo ticket médio real. Corte: ${fmtCurto(p.referencia.medianaFabricas)}
      nas fábricas, ${fmtCurto(p.referencia.medianaClientes)} nos clientes. ${esc(p.referencia.regra)}</span>
    </div>
  </div>

  <div class="sec">
    <h3>Fábricas (${p.fabricas.length})</h3>
    <table><tr><th>Fábrica</th><th class="num esconde-cel">Ticket</th><th class="num">Estado</th><th class="num">Perfil</th></tr>
    ${p.fabricas.map((f) => linha('fab', f)).join('')}</table>
  </div>

  <div class="sec">
    <h3>Clientes (${p.clientes.length})</h3>
    <div class="desc">Ordenados por ticket médio — os de cima são os candidatos naturais a alto padrão.</div>
    <table><tr><th>Cliente</th><th class="num esconde-cel">Ticket</th><th class="num">Estado</th><th class="num">Perfil</th></tr>
    ${p.clientes.map((c) => linha('cli', c)).join('')}</table>
  </div>

  <div class="salvar">
    <button class="btn btn-primary" id="btn-salvar-perfis" ${state.salvando ? 'disabled' : ''}>
      ${state.salvando ? 'Salvando…' : 'Salvar perfis'}</button>
    <span class="sug">${Object.keys(state.rascunho || {}).length} alteração(ões) não salva(s)</span>
    ${state.msg ? `<span class="sug">${esc(state.msg)}</span>` : ''}
  </div>`;
}

async function carregarPerfis() {
  state.perfis = null; render();
  try { state.perfis = await apiFetch('/api/perfis'); state.rascunho = {}; }
  catch (e) { state.erro = e.message; }
  render();
}

async function salvarPerfis() {
  state.salvando = true; state.msg = null; render();
  const fabricas = {}, clientes = {};
  Object.keys(state.rascunho || {}).forEach((k) => {
    const [tipo, id] = k.split('|');
    (tipo === 'fab' ? fabricas : clientes)[id] = state.rascunho[k];
  });
  try {
    const base = getApiBase().replace(/\/$/, '');
    const r = await fetch(base + '/api/perfis', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-token': getApiToken() },
      body: JSON.stringify({ fabricas, clientes }),
    });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || 'falhou');
    state.msg = `salvo: ${b.fabricas} fábricas, ${b.clientes} clientes`;
    state.rascunho = {};
    state.dados = null; // a análise muda com o perfil
  } catch (e) { state.msg = 'erro: ' + e.message; }
  state.salvando = false; render();
}
