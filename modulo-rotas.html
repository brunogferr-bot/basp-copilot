<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a8853a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rotas BASP">
<title>BASP Rotas Inteligentes</title>
<style>
  :root {
    color-scheme: light;
    --gold: #a8853a;
    --gold-light: #d2af78;
    --ink: #241f18;
    --ink-soft: #55503f;
    --bg: #f7f2e8;
    --card: #fffdf8;
    --border: #e3d6b6;
    --urgente: #b3261e;
    --urgente-bg: #fdecea;
    --atencao: #9a6300;
    --atencao-bg: #fff4dc;
    --emdia: #2e7d32;
    --emdia-bg: #eaf6ea;
    --semhist: #6b6b6b;
    --semhist-bg: #f0f0ee;
    --inativo: #8a8a8a;
    --inativo-bg: #ececec;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .display-font { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; }
  #app { max-width: 940px; margin: 0 auto; padding: 20px 16px 60px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .brand { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .brand small { display:block; color: var(--ink-soft); letter-spacing: 0.02em; text-transform: none; font-size: 11px; margin-top:2px; }
  .stats-strip {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .stat-chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font-size: 12.5px; color: var(--ink-soft);
  }
  .stat-chip b { color: var(--ink); }
  h1 {
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    font-size: 25px; margin: 10px 0 4px; font-weight: 600; letter-spacing: 0.01em;
    position: relative; padding-bottom: 10px;
  }
  h1::after {
    content: ''; position: absolute; left: 0; bottom: 0; width: 46px; height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
  }
  .subtitle { color: var(--ink-soft); font-size: 14px; margin-bottom: 18px; }
  .search-box {
    width: 100%; padding: 13px 16px; font-size: 15px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--card); margin-bottom: 14px;
  }
  .city-list { display: flex; flex-direction: column; gap: 8px; }
  .city-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; cursor: pointer; transition: border-color .15s;
  }
  .city-row:hover { border-color: var(--gold-light); }
  .city-row .name { font-weight: 600; font-size: 14.5px; }
  .city-row .uf { color: var(--ink-soft); font-weight: 400; font-size: 13px; margin-left: 6px;}
  .city-row .meta { display:flex; gap:8px; align-items:center; flex-wrap: wrap; justify-content: flex-end; }
  .badge { display:inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space:nowrap; }
  .badge-urgente { color: var(--urgente); background: var(--urgente-bg); }
  .badge-atencao { color: var(--atencao); background: var(--atencao-bg); }
  .badge-emdia { color: var(--emdia); background: var(--emdia-bg); }
  .badge-semhist { color: var(--semhist); background: var(--semhist-bg); }
  .badge-inativo { color: var(--inativo); background: var(--inativo-bg); }
  .badge-count { color: var(--ink-soft); background: #f2ede0; }
  .badge-group { color: #6b5322; background: #f6f2e6; border: 1px solid #ecdfc0; }
  .last-city-btn {
    display:inline-block; margin-bottom: 16px; padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--gold-light); color: var(--gold); background: #fbf5e9; font-size: 13px;
    cursor: pointer; font-weight: 600;
  }
  .backbar { display:flex; align-items:center; gap:10px; margin-bottom: 6px; }
  .back-btn {
    border: none; background: none; color: var(--gold); cursor: pointer; font-size: 14px;
    font-weight: 700; padding: 6px 0;
  }
  .client-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(168,133,58,0.08);
  }
  .client-card.is-inactive { opacity: 0.6; }
  .client-head { display:flex; justify-content: space-between; gap: 10px; align-items:flex-start; flex-wrap: wrap;}
  .client-name { font-weight: 700; font-size: 16px; font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; }
  .client-sub { color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; }
  .client-sub a { color: var(--ink-soft); }
  .badges-row { display:flex; gap:6px; flex-wrap: wrap; }
  .metrics-row {
    display:flex; gap: 16px; margin: 10px 0; font-size: 12.5px; color: var(--ink-soft); flex-wrap: wrap;
  }
  .metrics-row b { color: var(--ink); }
  .ranking-line {
    font-size: 12.5px; padding: 7px 10px; border-radius: 8px; margin: 8px 0;
    background: #eef3ee; color: #2f4b34; border: 1px solid #d9e6db;
  }
  .ranking-line small { color: #5b6f60; }
  .showroom-line {
    font-size: 12.5px; padding: 7px 10px; border-radius: 8px; margin: 8px 0;
    background: #f6f2e6; color: #6b5322; border: 1px solid #ecdfc0;
  }
  .pendencia-box {
    font-size: 12.5px; padding: 8px 10px; border-radius: 8px; margin: 8px 0;
    background: var(--urgente-bg); color: var(--urgente); border: 1px solid #f3c9c5;
    display:flex; justify-content: space-between; align-items:center; gap: 10px;
  }
  .pendencia-box button {
    font-size: 11.5px; border: 1px solid var(--urgente); background: white; color: var(--urgente);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; white-space: nowrap;
  }
  .last-interaction {
    font-size: 12.5px; color: var(--ink-soft); margin: 6px 0;
  }
  .card-actions { display:flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--gold-light); background: #fff; color: var(--gold);
    border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; font-weight: 600;
  }
  .btn:hover { background: #fbf5e9; }
  .btn-primary { background: var(--gold); color: #fff; border-color: var(--gold); }
  .btn-primary:hover { background: #8f7130; }
  .btn-ghost { border-color: var(--border); color: var(--ink-soft); }
  .btn-warn { border-color: #d8b0ac; color: var(--urgente); }
  .btn-sm { padding: 4px 9px; font-size: 11.5px; }
  .form-box {
    margin-top: 10px; padding: 12px; border: 1px dashed var(--border); border-radius: 10px; background: #fcfaf6;
  }
  .form-row { display:flex; gap:10px; margin-bottom: 8px; flex-wrap: wrap; }
  .form-row label { font-size: 12px; color: var(--ink-soft); display:block; margin-bottom:3px; }
  .form-row input[type=text], .form-row input[type=date], .form-row input[type=number], .form-row textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit;
  }
  .form-row textarea { min-height: 50px; resize: vertical; }
  .radio-group { display:flex; gap: 14px; }
  .radio-group label { display:flex; align-items:center; gap:5px; font-size: 13px; color: var(--ink); cursor:pointer;}
  .check-inline { display:flex; align-items:center; gap:6px; font-size:13px; margin-bottom:8px; }
  .history-toggle { font-size: 12px; color: var(--gold); cursor: pointer; text-decoration: underline; margin-top: 6px; display:inline-block;}
  .history-list { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
  .history-entry { font-size: 12px; color: var(--ink-soft); padding: 6px 0; border-bottom: 1px dotted var(--border); }
  .history-entry:last-child { border-bottom: none; }
  .empty-state { text-align:center; padding: 40px 20px; color: var(--ink-soft); }
  .hidden { display: none !important; }
  .group-panel {
    margin-top: 10px; padding: 12px; border: 1px solid #ecdfc0; border-radius: 10px; background: #fbf7ec;
  }
  .group-panel h4 { margin: 0 0 8px; font-size: 13px; color: #6b5322; }
  .candidate-row {
    display:flex; justify-content: space-between; align-items:center; padding: 6px 8px;
    border-bottom: 1px dotted var(--border); font-size: 12.5px; gap: 8px;
  }
  .candidate-row:last-child { border-bottom: none; }
  .candidate-info { flex:1; }
  .candidate-info .cname { font-weight: 600; }
  .candidate-info .cmeta { color: var(--ink-soft); font-size: 11.5px; }
  .member-row {
    display:flex; justify-content: space-between; align-items:center; padding: 6px 0;
    border-bottom: 1px dotted var(--border); font-size: 12px; gap: 8px;
  }
  .member-row:last-child { border-bottom: none; }
  .inactive-toggle-line {
    font-size: 12.5px; color: var(--gold); cursor: pointer; text-decoration: underline; margin: 10px 0;
  }

  .topbar-actions { display:flex; align-items:center; gap:8px; }
  .sync-btn {
    border: 1px solid var(--gold-light); background: #fbf5e9; color: var(--gold);
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; font-weight: 700;
    display:flex; align-items:center; gap:6px;
  }
  .sync-btn:disabled { opacity:0.6; cursor: default; }
  .sync-btn .spin {
    width:11px; height:11px; border-radius:50%; border:2px solid var(--gold-light);
    border-top-color: var(--gold); display:inline-block; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gear-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--ink-soft);
    border-radius: 999px; width: 30px; height: 30px; cursor: pointer; font-size: 14px;
  }
  .last-sync-note { font-size: 11.5px; color: var(--ink-soft); margin: -10px 0 14px; }
  .sync-summary { font-size: 12px; color: #2f4b34; background:#eef3ee; border:1px solid #d9e6db;
    border-radius:8px; padding:8px 10px; margin-bottom:14px; }
  .sync-error { font-size: 12px; color: var(--urgente); background: var(--urgente-bg);
    border:1px solid #f3c9c5; border-radius:8px; padding:8px 10px; margin-bottom:14px; }
  .center-screen { max-width: 420px; margin: 60px auto; text-align:center; padding: 0 16px; }
  .center-screen h1 { font-size: 20px; }
  .center-screen .subtitle { margin-bottom: 22px; }
  .center-screen input[type=text], .center-screen input[type=password] {
    width:100%; padding: 12px 14px; border:1px solid var(--border); border-radius: var(--radius);
    font-size: 14px; margin-bottom: 10px; font-family: inherit;
  }
  .center-screen .btn-primary { width:100%; padding: 12px; border-radius: var(--radius); font-size: 14px; }
  .settings-panel {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px;
  }
  .settings-panel label { font-size: 12px; color: var(--ink-soft); display:block; margin-bottom:4px; }
  .settings-panel input { width:100%; padding: 9px 11px; border:1px solid var(--border);
    border-radius: 8px; font-size: 13px; margin-bottom: 10px; font-family: inherit; }
  .spinner-big {
    width:34px; height:34px; border-radius:50%; border:3px solid var(--border);
    border-top-color: var(--gold); margin: 0 auto 16px; animation: spin 0.8s linear infinite;
  }

  /* ===== ACOES DE CAMPO (celular) ===== */
  .field-actions {
    display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
  }
  .field-btn {
    flex: 1 1 0; min-width: 92px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 10px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    text-decoration: none; border: 1px solid var(--border); background: var(--card);
    color: var(--ink); cursor: pointer; font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .field-btn:active { transform: scale(0.97); }
  .field-btn.call { border-color: #b7d2b9; color: #1f6b25; background: #f1f8f1; }
  .field-btn.zap  { border-color: #a9dcb8; color: #0e6b3c; background: #eefaf2; }
  .field-btn.map  { border-color: #b3c8e0; color: #1a4f80; background: #eef4fa; }
  .field-btn.off  { opacity: 0.4; pointer-events: none; }

  /* ===== FILTROS E ORDENACAO ===== */
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin: 4px 0 14px; }
  .filter-chip {
    border:1px solid var(--border); background: var(--card); color: var(--ink-soft);
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; cursor:pointer;
    font-family: inherit; -webkit-tap-highlight-color: transparent;
  }
  .filter-chip b { color: var(--ink); }
  .filter-chip.on { background: var(--gold); border-color: var(--gold); color:#fff; }
  .filter-chip.on b { color:#fff; }
  .sort-select {
    margin-left:auto; border:1px solid var(--border); background:var(--card);
    border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-family: inherit; color: var(--ink);
  }
  .stat-chip.clicavel { cursor:pointer; }
  .stat-chip.clicavel:hover { border-color: var(--gold); }
  .stat-chip.on { background: var(--gold); border-color: var(--gold); color:#fff; }
  .stat-chip.on b { color:#fff; }

  /* ===== NOME E APELIDO ===== */
  .client-razao { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .apelido-box { margin-top:10px; padding:12px; background:#fbf7ee; border:1px solid var(--border); border-radius:10px; }
  .apelido-box input { width:100%; padding:10px 12px; border:1px solid var(--border);
    border-radius:8px; font-size:14px; font-family:inherit; margin-bottom:8px; }
  .apelido-dica { font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; }

  /* ===== NUMEROS DETALHADOS ===== */
  .num-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
    gap:8px; margin:10px 0; }
  .num-box { background:#fbf7ee; border:1px solid var(--border); border-radius:10px; padding:9px 11px; }
  .num-lab { font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }
  .num-val { font-size:15px; font-weight:700; color:var(--ink); margin-top:2px; }
  .num-sub { font-size:10.5px; color:var(--ink-soft); margin-top:1px; }

  /* ===== FABRICAS ===== */
  .fab-wrap { margin-top:10px; padding:12px; background:#fbf7ee; border:1px solid var(--border); border-radius:10px; }
  .fab-titulo { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); margin-bottom:8px; }
  .fab-tickets { display:flex; flex-wrap:wrap; gap:7px; }
  .fab-ticket {
    border:1px solid var(--border); background:var(--card); border-radius:999px;
    padding:7px 12px; font-size:12px; cursor:pointer; font-family:inherit; color:var(--ink-soft);
    display:inline-flex; align-items:center; gap:6px; -webkit-tap-highlight-color: transparent;
  }
  .fab-ticket.comprada { background:#eef7ee; border-color:#b7d2b9; color:#1f6b25; font-weight:600; }
  .fab-ticket.elegivel { background:#fff4dc; border-color:#e0c68a; color:#8a6200; font-weight:600; }
  .fab-ticket.oportunidade { background:#fdecea; border-color:#e6b3ae; color:#a3241c; font-weight:700; }
  .fab-ticket .val { font-size:10.5px; opacity:.85; font-weight:400; }
  .fab-ticket.arquivada { opacity:.5; text-decoration: line-through; }
  .fab-item { display:inline-flex; align-items:center; }
  .fab-item .fab-ticket { border-top-right-radius:0; border-bottom-right-radius:0; border-right:none; }
  .fab-arq {
    border:1px solid var(--border); border-left:none; background:var(--card);
    border-radius:0 999px 999px 0; padding:7px 10px; font-size:12px; cursor:pointer;
    color:var(--ink-soft); font-family:inherit; -webkit-tap-highlight-color: transparent;
  }
  .fab-arq:hover { background:#fdecea; color:var(--urgente); }
  .fab-legenda { font-size:11px; color:var(--ink-soft); margin-top:9px; line-height:1.5; }
  .fab-alerta {
    margin-top:9px; padding:9px 11px; background:#fdecea; border-left:3px solid var(--urgente);
    border-radius:6px; font-size:12.5px; color:#8a1f18;
  }

  /* ===== FATURAMENTO POR FABRICA ===== */
  .num-box.clicavel { cursor:pointer; transition: border-color .15s; }
  .num-box.clicavel:hover { border-color: var(--gold); background:#fdf8ee; }
  .num-seta { color: var(--gold); font-weight:700; }
  .fab-linha { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .fab-linha:last-child { border-bottom: none; }
  .fab-linha-topo { display:flex; align-items:baseline; gap:9px; }
  .fab-pos { font-size:12px; color: var(--ink-soft); min-width:26px; font-weight:700; }
  .fab-nome { flex:1; font-weight:600; font-size:14.5px; }
  .fab-valor { font-weight:700; font-size:14.5px; white-space:nowrap; }
  .fab-barra { height:6px; background:#efe6d2; border-radius:99px; margin:7px 0 5px 35px; overflow:hidden; }
  .fab-barra span { display:block; height:100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
  .fab-linha-sub { font-size:11.5px; color: var(--ink-soft); margin-left:35px; }

  /* ===== CELULAR ===== */
  @media (max-width: 720px) {
    #app { padding: 14px 12px 80px; }
    h1 { font-size: 21px; }
    .subtitle { font-size: 13.5px; }
    .topbar { flex-wrap: wrap; gap: 10px; }
    .stats-strip { gap: 7px; margin-bottom: 14px; }
    .stat-chip { padding: 5px 11px; font-size: 12px; }

    /* alvos de toque maiores */
    .btn { padding: 10px 13px; font-size: 13.5px; }
    .btn-sm { padding: 7px 11px; font-size: 12.5px; }
    .card-actions { gap: 7px; }
    .card-actions .btn { flex: 1 1 46%; justify-content: center; text-align: center; }

    /* nao deixar o iPhone dar zoom ao focar num campo: precisa de 16px */
    input, select, textarea, .search-box,
    .settings-panel input, .center-screen input { font-size: 16px !important; }

    .client-card { padding: 14px 13px; }
    .client-head { flex-direction: column; align-items: flex-start; gap: 8px; }
    .client-name { font-size: 15.5px; line-height: 1.35; }
    .metrics-row { flex-direction: column; gap: 4px; font-size: 12.5px; }
    .ranking-line { font-size: 12.5px; }
    .form-row { flex-direction: column; gap: 10px; }
    .form-row > div { min-width: 0 !important; width: 100%; }
    .city-row { padding: 14px 13px; }
    .search-box { padding: 12px 14px; }
    .backbar { position: sticky; top: 0; z-index: 5; background: var(--bg);
               padding: 8px 0; margin: 0 0 8px; }
    .back-btn { padding: 9px 14px; font-size: 13.5px; }
  }

  @media (max-width: 400px) {
    .field-btn { font-size: 12.5px; padding: 10px 6px; min-width: 78px; }
    .card-actions .btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- CONFIG ----------
const DEFAULT_API_BASE = 'https://basp-rotas-api.onrender.com';
const API_BASE_KEY = 'basp_rotas_api_base_v1';
const API_TOKEN_KEY = 'basp_rotas_api_token_v1';
const LAST_CITY_KEY = 'basp_rotas_last_city_v1';

function getApiBase() { return localStorage.getItem(API_BASE_KEY) || DEFAULT_API_BASE; }
function getApiToken() { return localStorage.getItem(API_TOKEN_KEY) || ''; }
function setApiConfig(base, token) {
  localStorage.setItem(API_BASE_KEY, base || DEFAULT_API_BASE);
  localStorage.setItem(API_TOKEN_KEY, token || '');
}

async function apiFetch(path, options) {
  const base = getApiBase().replace(/\/$/, '');
  const token = getApiToken();
  const opts = Object.assign({}, options);
  opts.headers = Object.assign({ 'Content-Type': 'application/json', 'x-api-token': token }, (options && options.headers) || {});
  const res = await fetch(base + path, opts);
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  if (!res.ok) {
    const msg = (body && body.error) ? body.error : ('Erro ' + res.status + ' ao falar com o servidor.');
    throw new Error(msg);
  }
  return body;
}

// ---------- HELPERS ----------
function fmtDate(d) {
  if (!d) return '--';
  const dt = (d instanceof Date) ? d : new Date(d + 'T00:00:00Z');
  return dt.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
}
function fmtMoney(v) {
  if (v == null) return null;
  return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDateTime(iso) {
  if (!iso) return 'nunca';
  const dt = new Date(iso);
  return dt.toLocaleString('pt-BR');
}

// ---------- STATE ----------
let state = {
  screen: 'home', cityKey: null, search: '',
  openForm: null, openHistory: {}, openGroupPicker: null,
  openApelido: null, openFabricas: {}, verTodasFabricas: {},
  filtro: 'todos', ordem: 'urgencia',
  fabricasKey: null, periodoFab: 'tudo', voltarPara: null, fabDetalhe: {},
  groupSearchAll: {}, groupSearch: {}, showInactive: {},
  data: null, loading: true, error: null,
  syncing: false, syncMsg: null,
  settingsDraft: null,
};

/** Fabricas que o Bruno arquivou (nao trabalha mais). So afeta a exibicao. */
function arquivadasSet() {
  return new Set((state.data && state.data.fabricasArquivadas) || []);
}

/* ===== Datas no fuso de Brasília =====
 * BUG CORRIGIDO EM 29/07/2026: usar toISOString() para data de calendário
 * converte para UTC. Depois das 21h em Brasília a UTC já virou o dia seguinte,
 * e "dias sem comprar" aparecia com 1 dia a mais. Toda data de calendário
 * neste arquivo tem que passar por hojeBR()/isoBR().
 */
const TZ_BR = 'America/Sao_Paulo';

/** 'AAAA-MM-DD' de hoje em Brasília. */
function hojeBR() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: TZ_BR, year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(new Date());
}

/** Date em UTC representando o dia de calendário de Brasília (meia-noite). */
function hojeDateBR() {
  const [y, m, d] = hojeBR().split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}

function isoBR(d) {
  return d.toISOString().slice(0, 10);
}

/* ===== Semana corrente (segunda a domingo) ===== */

function semanaAtual() {
  const base = hojeDateBR();
  const dow = base.getUTCDay();                 // 0 = domingo
  const desdeSegunda = (dow === 0) ? 6 : dow - 1;
  const ini = new Date(base); ini.setUTCDate(base.getUTCDate() - desdeSegunda);
  const fim = new Date(ini);  fim.setUTCDate(ini.getUTCDate() + 6);
  return { ini: isoBR(ini), fim: isoBR(fim) };
}

function rotuloSemana() {
  const s = semanaAtual();
  const br = i => i.slice(8, 10) + '/' + i.slice(5, 7);
  return 'Visitadas ' + br(s.ini) + ' a ' + br(s.fim);
}

/** Visitas registradas nesta semana (segunda a domingo). */
function visitasDaSemana(entity) {
  const s = semanaAtual();
  return (entity.entries || []).filter(e =>
    e.tipo === 'visita' && e.date >= s.ini && e.date <= s.fim
  );
}

/** Fabricas que o Bruno marcou como elegiveis mas o cliente nunca comprou. */
function fabricasNuncaCompradas(entity) {
  const compradas = (entity.fabricas || []).map(f => f.nome);
  return (entity.fabricasElegiveis || []).filter(f => compradas.indexOf(f) < 0);
}

/** Lista de todas as fabricas conhecidas, montada a partir dos dados. */
function todasFabricas() {
  const s = new Set();
  entities().forEach(e => {
    (e.fabricas || []).forEach(f => s.add(f.nome));
    (e.fabricasElegiveis || []).forEach(f => s.add(f));
  });
  return Array.from(s).filter(n => n && n !== '(sem fabrica)').sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

function entities() { return (state.data && state.data.clients) || []; }

function allCities() {
  const map = new Map();
  entities().forEach(e => { if (!map.has(e.cdk)) map.set(e.cdk, { cdk: e.cdk, cd: e.cd, uf: e.uf }); });
  return Array.from(map.values()).sort((a, b) => a.cd.localeCompare(b.cd, 'pt-BR'));
}

function cityStats(cdk) {
  const items = entities().filter(e => e.cdk === cdk);
  let urgentes = 0, pendencias = 0, inativos = 0;
  items.forEach(e => {
    if (e.urgencia.rank === 0) urgentes++;
    if (e.urgencia.rank === 9) inativos++;
    pendencias += e.pendencias.length;
  });
  return { total: items.length, urgentes, pendencias, inativos };
}

function globalStats() {
  let urgentes = 0, pendencias = 0;
  entities().forEach(e => {
    if (e.urgencia.rank === 0) urgentes++;
    pendencias += e.pendencias.length;
  });
  return { total: entities().length, urgentes, pendencias, cidades: allCities().length };
}

// ---------- DATA LOADING ----------
async function loadData(showLoading) {
  if (showLoading !== false) state.loading = true;
  state.error = null;
  render();
  try {
    const res = await apiFetch('/api/data');
    state.data = res;
    state.error = null;
  } catch (e) {
    state.error = e.message || 'Não foi possível conectar ao servidor.';
  }
  state.loading = false;
  render();
}

/**
 * Recarrega os dados já sincronizados.
 *
 * NÃO chama mais /api/sync. Aquele endpoint dispara um robô no servidor que o
 * Mercos bloqueia: ele exige código por e-mail quando o acesso vem de fora do
 * Brasil, e o servidor fica nos EUA. O botão só mostrava um erro assustador.
 *
 * A sincronização de verdade roda pelo navegador já logado (tarefa agendada),
 * e este botão traz o resultado mais recente dela.
 */
async function doSync() {
  state.syncing = true;
  state.syncMsg = null;
  render();
  try {
    const antes = state.data && state.data.meta ? state.data.meta.lastSync : null;
    await loadData(false);
    const depois = state.data && state.data.meta ? state.data.meta.lastSync : null;
    state.syncMsg = {
      type: 'ok',
      text: (antes && depois && antes !== depois)
        ? 'Dados atualizados.'
        : 'Você já está com os dados mais recentes (sincronizados em ' + fmtDateTime(depois) + ').',
    };
  } catch (e) {
    state.syncMsg = { type: 'error', text: 'Não consegui buscar os dados: ' + e.message };
  }
  state.syncing = false;
  render();
}

async function postAndUpdate(path, body) {
  const res = await apiFetch(path, { method: 'POST', body: JSON.stringify(body || {}) });
  state.data = res;
  render();
}

// ---------- NAVIGATION ----------
function go(screen, cityKey) {
  state.screen = screen;
  state.cityKey = cityKey || null;
  state.search = '';
  state.openForm = null;
  state.openGroupPicker = null;
  if (cityKey) localStorage.setItem(LAST_CITY_KEY, cityKey);
  render();
}

function openSettings() {
  state.settingsDraft = { base: getApiBase(), token: getApiToken() };
  state.screen = 'settings';
  render();
}

// ---------- RENDER ----------
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'settings') {
    app.innerHTML = renderSettings();
    bindSettingsEvents();
    return;
  }
  if (!getApiToken()) {
    app.innerHTML = renderSettings(true);
    bindSettingsEvents();
    return;
  }
  if (state.loading && !state.data) {
    app.innerHTML = renderLoading();
    return;
  }
  if (state.error && !state.data) {
    app.innerHTML = renderError();
    bindErrorEvents();
    return;
  }
  if (state.screen === 'semana') {
    app.innerHTML = renderSemana();
  } else if (state.screen === 'fabricas') {
    app.innerHTML = renderTelaFabricas(state.fabricasKey);
  } else if (state.screen === 'home') {
    app.innerHTML = renderHome();
  } else if (state.screen === 'city') {
    app.innerHTML = renderCity(state.cityKey);
  }
  bindEvents();
}

/* ===== Filtros e ordenacao ===== */

const FILTROS = {
  todos:        { label: 'Todos',         teste: () => true },
  urgente:      { label: 'Urgentes',      teste: e => e.urgencia.cls === 'urgente' },
  atencao:      { label: 'Atenção',       teste: e => e.urgencia.cls === 'atencao' },
  emdia:        { label: 'Em dia',        teste: e => e.urgencia.cls === 'emdia' },
  pendencias:   { label: 'Com pendência', teste: e => (e.pendencias || []).length > 0 },
  showroom:     { label: 'Showroom ativo',teste: e => e.showroom && e.showroom.active },
  oportunidade: { label: 'Oportunidade',  teste: e => fabricasNuncaCompradas(e).length > 0 },
  semana:       { label: rotuloSemana,    teste: e => visitasDaSemana(e).length > 0, sempreVisivel: true },
  // ciclo longo = a BASP pesa pouco naquela loja. E onde tem margem pra ganhar espaco.
  crescer:      { label: 'Espaço p/ crescer', teste: e => e.ciclo != null && e.ciclo > 45 },
  fieis:        { label: 'Compram sempre',    teste: e => e.ciclo != null && e.ciclo <= 21 },
};

function rotuloFiltro(k) {
  const l = FILTROS[k].label;
  return (typeof l === 'function') ? l() : l;
}

const ORDENACOES = {
  urgencia: { label: 'Urgência', fn: (a, b) => {
    if (a.urgencia.rank !== b.urgencia.rank) return a.urgencia.rank - b.urgencia.rank;
    return (b.dias ?? -1) - (a.dias ?? -1);
  }},
  valor:    { label: 'Maior faturamento', fn: (a, b) => (b.valorTotal || 0) - (a.valorTotal || 0) },
  dias:     { label: 'Mais dias sem comprar', fn: (a, b) => (b.dias ?? -1) - (a.dias ?? -1) },
  atraso:   { label: 'Maior atraso no ciclo', fn: (a, b) => {
    const at = x => (x.dias != null && x.ciclo != null) ? (x.dias - x.ciclo) : -99999;
    return at(b) - at(a);
  }},
  ciclo:    { label: 'Maior espaço p/ crescer', fn: (a, b) => (b.ciclo ?? -1) - (a.ciclo ?? -1) },
  nome:     { label: 'Nome (A-Z)', fn: (a, b) => (a.nome || a.label).localeCompare(b.nome || b.label, 'pt-BR') },
  pedidos:  { label: 'Mais pedidos', fn: (a, b) => ((b.faturamento && b.faturamento.pedidos) || 0) - ((a.faturamento && a.faturamento.pedidos) || 0) },
};

function aplicaFiltro(lista) {
  const f = FILTROS[state.filtro] || FILTROS.todos;
  return lista.filter(f.teste);
}

function aplicaOrdem(lista) {
  const o = ORDENACOES[state.ordem] || ORDENACOES.urgencia;
  return lista.slice().sort(o.fn);
}

function renderToolbar(lista) {
  const chips = Object.keys(FILTROS).map(k => {
    const qtd = k === 'todos' ? lista.length : lista.filter(FILTROS[k].teste).length;
    if (k !== 'todos' && qtd === 0 && !FILTROS[k].sempreVisivel) return '';
    return `<button class="filter-chip ${state.filtro === k ? 'on' : ''}" data-filtro="${k}">
      ${rotuloFiltro(k)} <b>${qtd}</b></button>`;
  }).join('');

  const opts = Object.keys(ORDENACOES).map(k =>
    `<option value="${k}" ${state.ordem === k ? 'selected' : ''}>${ORDENACOES[k].label}</option>`
  ).join('');

  return `<div class="toolbar">
    ${chips}
    <select class="sort-select" id="sort-select" title="Ordenar por">${opts}</select>
  </div>`;
}

/* ===== Tela: faturamento por fábrica de um cliente ===== */

const PERIODOS = {
  tudo:  { label: 'Desde o início', meses: null },
  m12:   { label: 'Últimos 12 meses', meses: 12 },
  m24:   { label: 'Últimos 24 meses', meses: 24 },
  ano:   { label: 'Este ano', meses: 'ano' },
};

function mesesDoPeriodo(chave) {
  const p = PERIODOS[chave] || PERIODOS.tudo;
  if (!p.meses) return null;
  const hoje = hojeDateBR();
  if (p.meses === 'ano') return { de: hoje.getUTCFullYear() + '-01', ate: '9999-99' };
  const d = new Date(Date.UTC(hoje.getUTCFullYear(), hoje.getUTCMonth() - (p.meses - 1), 1));
  return { de: d.toISOString().slice(0, 7), ate: '9999-99' };
}

/** Soma a fábrica no período pedido. Se não houver dado mensal, cai no total. */
function totalFabricaNoPeriodo(fab, faixa) {
  if (!faixa) return { total: fab.total, pedidos: fab.pedidos };
  if (!fab.meses) return null;
  let total = 0, pedidos = 0;
  Object.keys(fab.meses).forEach(m => {
    if (m >= faixa.de && m <= faixa.ate) {
      total += fab.meses[m].v || 0;
      pedidos += fab.meses[m].p || 0;
    }
  });
  return { total: Math.round(total * 100) / 100, pedidos };
}

/**
 * Busca o detalhe mes a mes de UM cliente.
 * Fica fora do /api/data porque o historico mensal de todos os clientes
 * juntos deixava a carga inicial lenta demais no celular.
 */
async function carregarFabricasDetalhe(logId) {
  if (state.fabDetalhe[logId]) return;
  try {
    const r = await apiFetch('/api/clients/' + encodeURIComponent(logId) + '/fabricas');
    state.fabDetalhe[logId] = r.fabricas || [];
  } catch (e) {
    state.fabDetalhe[logId] = 'erro';
  }
  render();
}

function renderTelaFabricas(logId) {
  const e = entities().find(x => x.logId === logId);
  if (!e) return '<div class="empty-state">Cliente não encontrado.</div>';

  const det = state.fabDetalhe[logId];
  if (!det) {
    carregarFabricasDetalhe(logId);
    return `${renderTopbar()}
      <div class="backbar"><button class="back-btn" id="btn-volta-cliente">← Voltar</button></div>
      <h1>${e.nome || e.label}</h1>
      <div class="center-screen"><div class="spinner-big"></div>
      <div class="subtitle">Carregando o histórico por fábrica...</div></div>`;
  }

  const per = state.periodoFab || 'tudo';
  const faixa = mesesDoPeriodo(per);
  const arquivadas = arquivadasSet();
  const fonte = (det === 'erro') ? (e.fabricas || []) : det;

  const dados = (fonte || [])
    .filter(f => !arquivadas.has(f.nome))
    .map(f => ({ f, calc: totalFabricaNoPeriodo(f, faixa) }))
    .filter(x => x.calc && x.calc.total > 0)
    .sort((a, b) => b.calc.total - a.calc.total);

  const semDadoMensal = faixa && (fonte || []).some(f => !f.meses);
  const somaPeriodo = dados.reduce((s, x) => s + x.calc.total, 0);

  const opts = Object.keys(PERIODOS).map(k =>
    `<option value="${k}" ${per === k ? 'selected' : ''}>${PERIODOS[k].label}</option>`).join('');

  const linhas = dados.map((x, i) => {
    const pct = somaPeriodo > 0 ? (x.calc.total / somaPeriodo * 100) : 0;
    return `<div class="fab-linha">
      <div class="fab-linha-topo">
        <span class="fab-pos">${i + 1}º</span>
        <span class="fab-nome">${x.f.nome}</span>
        <span class="fab-valor">${fmtMoney(x.calc.total)}</span>
      </div>
      <div class="fab-barra"><span style="width:${pct.toFixed(1)}%"></span></div>
      <div class="fab-linha-sub">
        ${pct.toFixed(1)}% do faturamento · ${x.calc.pedidos} pedido(s)
        ${x.f.ultima ? ' · última compra ' + fmtDate(x.f.ultima) : ''}
      </div>
    </div>`;
  }).join('');

  return `
    ${renderTopbar()}
    <div class="backbar"><button class="back-btn" id="btn-volta-cliente">← Voltar</button></div>
    <h1>${e.nome || e.label}</h1>
    <div class="subtitle">Faturamento acumulado por fábrica${e.isGroup ? ', somando os ' + e.members.length + ' CNPJs do grupo' : ''}.</div>
    <div class="toolbar">
      <span class="stat-chip"><b>${fmtMoney(somaPeriodo)}</b> no período</span>
      <span class="stat-chip"><b>${dados.length}</b> fábrica(s)</span>
      <select class="sort-select" id="periodo-fab">${opts}</select>
    </div>

function renderCity(cdk) {
  const items = entities().filter(e => e.cdk === cdk);
  const cityMeta = items[0];
  let filtered = items;
  if (state.search) {
    const q = state.search.toLowerCase();
    filtered = items.filter(e =>
      (e.nome || '').toLowerCase().includes(q) ||
      e.label.toLowerCase().includes(q) ||
      (e.fantasia || '').toLowerCase().includes(q)

  }

  const active = [];
  const inactive = [];
  filtered.forEach(e => { if (e.urgencia.rank === 9) inactive.push(e); else active.push(e); });

  const visiveis = aplicaOrdem(aplicaFiltro(active));
  inactive.sort((a, b) => (a.nome || a.label).localeCompare(b.nome || b.label, 'pt-BR'));

  const st = cityStats(cdk);
  const showInactive = !!state.showInactive[cdk];

  const cards = visiveis.map(e => renderCard(e)).join('');
  const inactiveCards = inactive.map(e => renderCard(e)).join('');

  const chip = (k, txt, n) =>
    `<span class="stat-chip clicavel ${state.filtro === k ? 'on' : ''}" data-filtro="${k}"><b>${n}</b> ${txt}</span>`;

  return `

      ${st.inativos > 0 ? `<span class="stat-chip"><b>${st.inativos}</b> marcados inativos</span>` : ''}

}

/* ===== Duas leituras diferentes, propositalmente separadas =====
 * "Dias sem comprar" responde: esta na hora de visitar?
 *   Base: o ultimo pedido do GRUPO (qualquer CNPJ).
 * "Compra a cada" responde: qual o meu peso nessa loja?
 *   Ciclo curto = escritorio relevante. Ciclo longo = participacao pequena
 *   entre as fabricas dela, ou seja, espaco para crescer.
 */

function atrasoTexto(entity) {
  const d = entity.dias, c = entity.ciclo;
  if (d == null || c == null) return 'sem histórico de cadência';
  const atraso = d - c;
  if (atraso >= 30) return `<b style="color:var(--urgente)">${atraso} dias além do ciclo</b>`;
  if (atraso >= 0) return `${atraso} dias além do ciclo`;
  return `dentro do ciclo (faltam ${Math.abs(atraso)})`;
}

function participacaoTexto(entity) {
  const c = entity.ciclo;
  if (c == null) return 'sem pedidos suficientes';
  const n = entity.pedidosNoCiclo || 0;
  let leitura;
  if (c <= 21) leitura = 'compra toda semana — escritório forte aqui';
  else if (c <= 45) leitura = 'boa presença';
  else if (c <= 90) leitura = 'espaço para crescer';
  else leitura = 'participação baixa — muita margem';
  return `${leitura}${n ? ' · ' + n + ' pedidos' : ''}`;
}

/* ===== Acoes de campo: ligar, WhatsApp e rota ===== */

/** Pega o primeiro telefone utilizavel do campo do Mercos (que vem baguncado). */
function primeiroTelefone(tel) {
  if (!tel) return null;
  // o Mercos junta varios numeros e nomes na mesma string
  const achados = String(tel).match(/\(?\d{2}\)?[\s.-]?\d{4,5}[\s.-]?\d{4}/g);
  if (!achados || !achados.length) return null;
  return achados[0].replace(/\D/g, '');
}

/** Escolhe um celular (9 digitos apos o DDD) se existir; senao o primeiro numero. */
function telefoneWhats(tel) {
  if (!tel) return null;
  const achados = String(tel).match(/\(?\d{2}\)?[\s.-]?\d{4,5}[\s.-]?\d{4}/g) || [];
  const limpos = achados.map(t => t.replace(/\D/g, '')).filter(t => t.length >= 10);
  const celular = limpos.find(t => t.length === 11);
  const escolhido = celular || limpos[0];
  return escolhido ? '55' + escolhido : null;
}

function renderFieldActions(entity) {
  const tel = primeiroTelefone(entity.tel);
  const zap = telefoneWhats(entity.tel);
  // bairro e CEP fazem muita diferenca em cidade de quadra/lote (Goiania)
  const endereco = [entity.end, entity.bairro, entity.cd, entity.uf, entity.cep]
    .filter(function (x) { return x && String(x).trim(); })
    .join(', ');
  const mapsUrl = endereco
    ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(endereco)
    : null;

  return `<div class="field-actions">
    ${tel
      ? `<a class="field-btn call" href="tel:${tel}">📞 Ligar</a>`
      : `<span class="field-btn call off">📞 Sem telefone</span>`}
    ${zap
      ? `<a class="field-btn zap" href="https://wa.me/${zap}" target="_blank" rel="noopener">💬 WhatsApp</a>`
      : `<span class="field-btn zap off">💬 WhatsApp</span>`}
    ${mapsUrl
      ? `<a class="field-btn map" href="${mapsUrl}" target="_blank" rel="noopener">🧭 Rota</a>`
      : `<span class="field-btn map off">🧭 Sem endereço</span>`}
  </div>`;
}

function renderFabricas(entity) {
  const encKey = encodeURIComponent(entity.logId);
  const compradas = entity.fabricas || [];
  const mapa = {};
  compradas.forEach(f => { mapa[f.nome] = f; });
  const elegiveis = entity.fabricasElegiveis || [];
  const verTudo = !!state.verTodasFabricas[entity.logId];

  // Fábricas arquivadas somem da lista para não poluir. É só visual:
  // o faturamento delas continua contando no total e no ranking.
  const arquivadas = arquivadasSet();
  const todas = todasFabricas();
  const relevantes = todas.filter(n => !arquivadas.has(n));
  const ocultas = todas.length - relevantes.length;
  const lista = (verTudo ? todas : relevantes).slice().sort((a, b) => {
    // já compradas primeiro, do maior valor para o menor
    const va = mapa[a] ? mapa[a].total : -1;
    const vb = mapa[b] ? mapa[b].total : -1;
    if (va !== vb) return vb - va;
    // depois as elegíveis ainda não compradas
    const ea = elegiveis.indexOf(a) >= 0 ? 1 : 0;
    const eb = elegiveis.indexOf(b) >= 0 ? 1 : 0;
    if (ea !== eb) return eb - ea;
    return a.localeCompare(b, 'pt-BR');
  });

  const tickets = lista.map(nome => {
    const comprou = !!mapa[nome];
    const elegivel = elegiveis.indexOf(nome) >= 0;
    const arquivada = arquivadas.has(nome);
    let cls = arquivada ? 'arquivada' : '';
    if (!arquivada && comprou) cls = 'comprada';
    else if (!arquivada && elegivel) cls = 'oportunidade';
    const val = comprou
      ? `<span class="val">${fmtMoney(mapa[nome].total)} · ${mapa[nome].pedidos}x</span>`
      : (elegivel ? '<span class="val">nunca comprou</span>' : '');
    const marca = arquivada ? '🗄' : (elegivel ? '☑' : '☐');
    return `<span class="fab-item">
      <button class="fab-ticket ${cls}" data-fab="${encodeURIComponent(nome)}" data-fab-key="${encKey}"
        title="${arquivada ? 'Fábrica arquivada' : 'Marcar como elegível'}">${marca} ${nome} ${val}</button>
      <button class="fab-arq" data-arquivar="${encodeURIComponent(nome)}"
        title="${arquivada ? 'Voltar a trabalhar com esta fábrica' : 'Não trabalho mais com esta fábrica'}">${arquivada ? '↩' : '✕'}</button>
    </span>`;
  }).join('');

  const naoCompradas = elegiveis.filter(f => !mapa[f]);

  return `<div class="fab-wrap" data-fabricas-key="${encKey}">
    <div class="fab-titulo">Fábricas deste cliente</div>
    <div class="fab-tickets">${tickets || '<span class="fab-legenda">Nenhuma fábrica conhecida ainda.</span>'}</div>
    <div class="fab-legenda">
      <b>Verde</b> = já comprou (valor e nº de pedidos no histórico).
      <b>Vermelho</b> = você marcou como elegível mas ele nunca comprou — é a oportunidade.
      Toque no ticket para marcar ou desmarcar como elegível.<br>
      O <b>✕</b> ao lado arquiva a fábrica em toda a carteira, para quando você não
      trabalha mais com ela. Isso é só visual — o faturamento que ela gerou
      continua contando no total e no ranking.
    </div>
    ${naoCompradas.length ? `<div class="fab-alerta">
      🎯 ${naoCompradas.length} fábrica(s) elegível(is) sem nenhuma compra: <b>${naoCompradas.join(', ')}</b>
    </div>` : ''}
    ${(ocultas > 0 || verTudo) ? `<div class="inactive-toggle-line" data-ver-fabricas="${encKey}">
      ${verTudo ? 'Ocultar as arquivadas' : 'Mostrar ' + ocultas + ' fábrica(s) arquivada(s)'}
    </div>` : ''}
  </div>`;
}

// ---------- GROUPING LOGIC ----------
async function linkEntities(entityA, entityB) {
  const anchor = entityA.members[0].c;
  const others = entityA.members.slice(1).map(m => m.c).concat(entityB.members.map(m => m.c));
  for (const other of others) {
    await postAndUpdate('/api/clients/group', { nameA: anchor, nameB: other });
  }
}

}

// ---------- EVENTS ----------
function bindEvents() {
  const searchHome = document.getElementById('city-search');
  if (searchHome) searchHome.addEventListener('input', e => { state.search = e.target.value; render(); preserveFocus('city-search'); });
  const searchCity = document.getElementById('client-search');
  if (searchCity) searchCity.addEventListener('input', e => { state.search = e.target.value; render(); preserveFocus('client-search'); });
  const lastBtn = document.getElementById('btn-last-city');
  if (lastBtn) lastBtn.addEventListener('click', () => go('city', localStorage.getItem(LAST_CITY_KEY)));

  const syncBtn = document.getElementById('btn-sync');
  if (syncBtn) syncBtn.addEventListener('click', () => doSync());
  const gearBtn = document.getElementById('btn-gear');
  if (gearBtn) gearBtn.addEventListener('click', () => openSettings());

  document.querySelectorAll('.city-row').forEach(row => {
    row.addEventListener('click', () => go('city', row.getAttribute('data-city')));
  });

  const backBtn = document.getElementById('btn-back');
  if (backBtn) backBtn.addEventListener('click', () => go('home'));

  const toggleInactive = document.getElementById('toggle-inactive');
  if (toggleInactive) toggleInactive.addEventListener('click', () => {
    const cdk = toggleInactive.getAttribute('data-city');
    state.showInactive[cdk] = !state.showInactive[cdk];
    render();
  });

  document.querySelectorAll('[data-toggle-form]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = decodeURIComponent(btn.getAttribute('data-toggle-form'));
      state.openForm = (state.openForm === key) ? null : key;
      state.openGroupPicker = null;
      render();
    });
  });
  document.querySelectorAll('[data-cancel-form]').forEach(btn => {
    btn.addEventListener('click', () => { state.openForm = null; render(); });
  });
  document.querySelectorAll('[data-toggle-history]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = decodeURIComponent(btn.getAttribute('data-toggle-history'));
      state.openHistory[key] = !state.openHistory[key];
      render();
    });
  });

  /* ---- filtros, chips e ordenacao ---- */
  document.querySelectorAll('[data-filtro]').forEach(el => {
    el.addEventListener('click', () => {
      const f = el.getAttribute('data-filtro');
      state.filtro = (state.filtro === f && f !== 'todos') ? 'todos' : f;
      render();
    });
  });
  const sortSel = document.getElementById('sort-select');
  if (sortSel) {
    sortSel.addEventListener('change', e => { state.ordem = e.target.value; render(); });
  }

  /* ---- apelido ---- */
  document.querySelectorAll('[data-toggle-apelido]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = decodeURIComponent(btn.getAttribute('data-toggle-apelido'));
      state.openApelido = (state.openApelido === key) ? null : key;
      render();
    });
  });
  document.querySelectorAll('[data-cancel-apelido]').forEach(btn => {
    btn.addEventListener('click', () => { state.openApelido = null; render(); });
  });
  document.querySelectorAll('[data-save-apelido]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = decodeURIComponent(btn.getAttribute('data-save-apelido'));
      const box = btn.closest('.apelido-box');
      const valor = box.querySelector('.f-apelido').value.trim();
      btn.disabled = true; btn.textContent = 'Salvando...';
      try {
        await postAndUpdate('/api/clients/' + encodeURIComponent(key) + '/apelido', { apelido: valor });
        state.openApelido = null;
        render();
      } catch (err) {
        alert(err.message);
        btn.disabled = false; btn.textContent = 'Salvar';
      }
    });
  });
  document.querySelectorAll('[data-clear-apelido]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = decodeURIComponent(btn.getAttribute('data-clear-apelido'));
      btn.disabled = true;
      try {
        await postAndUpdate('/api/clients/' + encodeURIComponent(key) + '/apelido', { apelido: '' });
        state.openApelido = null;
        render();
      } catch (err) { alert(err.message); btn.disabled = false; }
    });
  });

  /* ---- fabricas ---- */
  document.querySelectorAll('[data-toggle-fabricas]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = decodeURIComponent(btn.getAttribute('data-toggle-fabricas'));
      state.openFabricas[key] = !state.openFabricas[key];
      render();
    });
  });
  const chipSemana = document.getElementById('chip-semana');
  if (chipSemana) {
    chipSemana.addEventListener('click', () => {
      state.screen = 'semana';
      window.scrollTo(0, 0);
      render();
    });
  }
  const btnHome = document.getElementById('btn-home');
  if (btnHome) {
    btnHome.addEventListener('click', () => { state.screen = 'home'; state.cityKey = null; render(); });
  }
  document.querySelectorAll('[data-abrir-fabricas]').forEach(el => {
    el.addEventListener('click', () => {
      state.fabricasKey = decodeURIComponent(el.getAttribute('data-abrir-fabricas'));
      state.voltarPara = { screen: state.screen, cityKey: state.cityKey };
      state.screen = 'fabricas';
      window.scrollTo(0, 0);
      render();
    });
  });
  const btnVoltaCliente = document.getElementById('btn-volta-cliente');
  if (btnVoltaCliente) {
    btnVoltaCliente.addEventListener('click', () => {
      const v = state.voltarPara || { screen: 'home', cityKey: null };
      state.screen = v.screen === 'fabricas' ? 'home' : v.screen;
      state.cityKey = v.cityKey;
      render();
    });
  }
  const selPer = document.getElementById('periodo-fab');
  if (selPer) {
    selPer.addEventListener('change', e => { state.periodoFab = e.target.value; render(); });
  }
  document.querySelectorAll('[data-go-city]').forEach(el => {
    el.addEventListener('click', () => {
      state.cityKey = el.getAttribute('data-go-city');
      state.screen = 'city';
      state.filtro = 'semana';
      state.search = '';
      window.scrollTo(0, 0);
      render();
    });
  });
  document.querySelectorAll('[data-arquivar]').forEach(btn => {
    btn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const nome = decodeURIComponent(btn.getAttribute('data-arquivar'));
      const atuais = ((state.data && state.data.fabricasArquivadas) || []).slice();
      const i = atuais.indexOf(nome);
      if (i >= 0) atuais.splice(i, 1); else atuais.push(nome);
      btn.disabled = true;
      try {
        await postAndUpdate('/api/fabricas/arquivadas', { fabricas: atuais });
        render();
      } catch (err) { alert(err.message); btn.disabled = false; }
    });
  });
  document.querySelectorAll('[data-ver-fabricas]').forEach(el => {
    el.addEventListener('click', () => {
      const key = decodeURIComponent(el.getAttribute('data-ver-fabricas'));
      state.verTodasFabricas[key] = !state.verTodasFabricas[key];
      render();
    });
  });
  document.querySelectorAll('[data-fab]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = decodeURIComponent(btn.getAttribute('data-fab-key'));
      const nome = decodeURIComponent(btn.getAttribute('data-fab'));
      const ent = entities().find(e => e.logId === key);
      if (!ent) return;
      const atuais = (ent.fabricasElegiveis || []).slice();
      const i = atuais.indexOf(nome);
      if (i >= 0) atuais.splice(i, 1); else atuais.push(nome);
      btn.disabled = true;
      try {
        await postAndUpdate('/api/clients/' + encodeURIComponent(key) + '/fabricas-elegiveis', { fabricas: atuais });
        render();
      } catch (err) { alert(err.message); btn.disabled = false; }
    });
  });
  document.querySelectorAll('[data-resolve]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = decodeURIComponent(btn.getAttribute('data-key'));
      const id = btn.getAttribute('data-resolve');
      btn.disabled = true;
      try {
        await postAndUpdate(`/api/clients/${encodeURIComponent(key)}/pendencias/${encodeURIComponent(id)}/resolver`, {});
      } catch (e) { alert('Erro: ' + e.message); render(); }
    });
  });
  document.querySelectorAll('.f-pedido').forEach(chk => {
    chk.addEventListener('change', (e) => {
      const box = e.target.closest('.form-box');
      const valorRow = box.querySelector('.f-valor-row');
      valorRow.classList.toggle('hidden', !e.target.checked);
    });
  });
  document.querySelectorAll('[data-save-form]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = decodeURIComponent(btn.getAttribute('data-save-form'));
      const box = document.querySelector(`.form-box[data-form-key="${CSS.escape(encodeURIComponent(key))}"]`);
      if (!box) return;
      const date = box.querySelector('.f-date').value || todayISO();
      const tipo = box.querySelector('.f-tipo:checked') ? box.querySelector('.f-tipo:checked').value : 'visita';
      const pedido = box.querySelector('.f-pedido').checked;
      const valor = pedido ? parseFloat(box.querySelector('.f-valor').value || '0') || null : null;
      const obs = box.querySelector('.f-obs').value.trim();
      const pendencia = box.querySelector('.f-pend').value.trim();
      btn.disabled = true;
      try {
        await postAndUpdate(`/api/clients/${encodeURIComponent(key)}/interactions`, { date, tipo, pedido, valor, obs, pendencia });
        state.openForm = null;
        render();
      } catch (e) { alert('Erro ao salvar: ' + e.message); render(); }
    });
  });

  // grouping
  document.querySelectorAll('[data-toggle-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = decodeURIComponent(btn.getAttribute('data-toggle-group'));
      state.openGroupPicker = (state.openGroupPicker === key) ? null : key;
      state.openForm = null;
      render();
    });
  });
  document.querySelectorAll('[data-close-group]').forEach(btn => {
    btn.addEventListener('click', () => { state.openGroupPicker = null; render(); });
  });
  document.querySelectorAll('.g-search').forEach(inp => {
    inp.addEventListener('input', (e) => {
      const panel = e.target.closest('.group-panel');
      const key = decodeURIComponent(panel.getAttribute('data-group-key'));
      state.groupSearch[key] = e.target.value;
      render();
      const el = document.querySelector(`.group-panel[data-group-key="${CSS.escape(encodeURIComponent(key))}"] .g-search`);
      if (el) { el.focus(); const v = el.value; el.value = ''; el.value = v; }
    });
  });
  document.querySelectorAll('.g-search-all').forEach(chk => {
    chk.addEventListener('change', (e) => {
      const panel = e.target.closest('.group-panel');
      const key = decodeURIComponent(panel.getAttribute('data-group-key'));
      state.groupSearchAll[key] = e.target.checked;
      render();
    });
  });
  document.querySelectorAll('[data-link-to]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const thisKey = decodeURIComponent(btn.getAttribute('data-group'));
      const otherKey = decodeURIComponent(btn.getAttribute('data-link-to'));
      const thisEntity = entities().find(e => e.logId === thisKey);
      const otherEntity = entities().find(e => e.logId === otherKey);
      if (!thisEntity || !otherEntity) return;
      btn.disabled = true;
      try {
        await linkEntities(thisEntity, otherEntity);
        state.openGroupPicker = null;
        render();
      } catch (e) { alert('Erro ao vincular: ' + e.message); render(); }
    });
  });
  document.querySelectorAll('[data-unlink]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = decodeURIComponent(btn.getAttribute('data-unlink'));
      btn.disabled = true;
      try {
        await postAndUpdate('/api/clients/unlink', { name });
      } catch (e) { alert('Erro ao desvincular: ' + e.message); render(); }
    });
  });

  // manual inactive toggle
  document.querySelectorAll('[data-toggle-inactive]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = decodeURIComponent(btn.getAttribute('data-toggle-inactive'));
      const entity = entities().find(e => e.logId === key);
      const isInactive = entity && entity.urgencia.rank === 9;
      btn.disabled = true;
      try {
        await postAndUpdate(`/api/clients/${encodeURIComponent(key)}/inactive`, { inactive: !isInactive });
      } catch (e) { alert('Erro: ' + e.message); render(); }
    });
  });
}

function preserveFocus(id) {
  const el = document.getElementById(id);
  if (el) { el.focus(); const v = el.value; el.value = ''; el.value = v; }
}

// ---------- INIT ----------
if (getApiToken()) { loadData(); } else { render(); }
</script>
</body>
</html>
